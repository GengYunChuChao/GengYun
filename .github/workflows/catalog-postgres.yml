name: Catalog real PostgreSQL gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  catalog-pg:
    name: catalog-postgres-17.11
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: gengyun_catalog_test
          POSTGRES_USER: gengyun_ci_owner
          POSTGRES_PASSWORD: synthetic-ci-owner-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node tests/integration/catalog-pg.mjs
        env:
          DATABASE_TEST_URL: postgres://gengyun_ci_owner:synthetic-ci-owner-only@127.0.0.1:5432/gengyun_catalog_test
