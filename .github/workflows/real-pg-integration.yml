# 真库臂（real PostgreSQL 17.11）· 把「已在 main、却没有任何 workflow 跑过」的集成脚本接进 CI：
#   · tests/integration/conversations-pg.mjs（#313 / I12）
#   · tests/integration/community-pg.mjs（#296 / I15）
#   · tests/integration/messages-pg.mjs（#17 / I17）；R27-S4 追加
#   · tests/integration/favorites-history-pg.mjs（#16 / I16）；R27-S4 追加
#   · tests/integration/backup-copies-purge-pg.mjs（#19 / GY-I19 的 P0-4 执行者）；R28-E5 追加
#   · tests/integration/qa-citations-pg.mjs（#12 / 问答引用可溯源）；R31 追加
#   · tests/integration/admin-jobs-pg.mjs（#9 / 作业台：开关生效·作业可见·变更留痕·最小权限）；R31 追加
#   · tests/integration/ocr-corrections-pg.mjs（#10 / OCR 校正台账）；R31 追加
#
# 为什么这些脚本**必须**真库：它们锁的是只有数据库能证明的性质——迁移子集按序 apply 且二连跑
# 0 条、唯一键真的能裁决并发、外键真的挡孤儿行、枚举/CHECK 真的拒绝闭集外的值、
# `catalog_read.current_knowledge` 真的带 `created_at`、以及 `buildApp` 在有真库时真的开启对应域。
# 内存库与替身证明不了这些；而 CI 里没有真库的「跳过」等于这一轮什么都没验证。
# 消息域与收藏历史域（R27-S4 追加的两条）同属这一类：`messages.revision` 只能由一条原子 UPDATE
# 推进、重复写由唯一约束裁决、未读数是每次现算的派生量；收藏/历史的去重同样由唯一键裁决、
# CAS 删除的三档错误码与「幂等台账真落库、能被另一条独立连接写入唤醒」也只有真库能证明。
#
# 为什么缺库必须**红**（而不是「跳过」）：带「缺前置 ⇒ 打印 SKIP」分支的那几个（会话链／社区域／
# 收藏历史／标签 OCR 域）**以 77 退出**（POSIX skipped＝未取得，不是通过；仓内
# `tests/unit/integration-script-coverage.test.mjs` 的「整链跳过必须给 77」把它固化成硬约定）；
# messages-pg 没有跳过分支——缺 argv 就退回默认端口、连不上即非 0 失败。两条都不是「通过」。
# 另一条独立约束：本 workflow **不设**任何放宽开关、也**不传**任何跳过参数：
# 真库没起来（service 未健康、库没建出来、连接串写错）⇒ 脚本 77 或非 0 ⇒ 本 job 红。
# 这个红是**正确的读数**：它说的是「真库臂这一轮没有验证」，不是「验证通过」。
# 反过来，把放宽开关写进 workflow 就会让「0 条断言」被读成绿 ——
# `tests/unit/ci-real-pg-wiring.test.mjs` 对任何 workflow 里出现这类开关一律判红。
#
# 库的分配：每个脚本各自**硬钉**库名且要求**空库**（脚本开头断言 public 下没有任何表），因此不能
# 共用一个库；`services.postgres` 只按 `POSTGRES_DB` 建一个库，故每个 step 先用 runner 上已有的
# `psql` 建**专用空库**，再真跑该脚本（形状照抄 `.github/workflows/consent-grant-postgres.yml`）。
# `POSTGRES_DB` 那一份只当 psql 的连接靴库用，脚本从不连它。
#
# 口令是**明显的合成值**（`synthetic-ci-owner-only`），与其它 PG workflow 同值；不含任何真实凭据。

name: Real PostgreSQL integration gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  real-pg-17-11:
    name: real-pg-17.11
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: gengyun_ci_bootstrap
          POSTGRES_USER: gengyun_ci_owner
          POSTGRES_PASSWORD: synthetic-ci-owner-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      # 会话链（#313）：库名硬钉 `gengyun_conversations_test`，脚本自己断言 public 下无表。
      # `&&` 串联保证「建库失败」不会滑过去变成「脚本 77 也算跑过」——两步都必须成功。
      - run: psql -v ON_ERROR_STOP=1 -c 'CREATE DATABASE gengyun_conversations_test' && node tests/integration/conversations-pg.mjs
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: gengyun_ci_owner
          PGPASSWORD: synthetic-ci-owner-only
          PGDATABASE: gengyun_ci_bootstrap
          CONVERSATIONS_PG_TEST_URL: postgres://gengyun_ci_owner:synthetic-ci-owner-only@127.0.0.1:5432/gengyun_conversations_test
      # 社区域（#296）：库名硬钉 `gengyun_community_test`，同样要求空库；顺序在会话链之后，
      # 两者不共享任何库/角色状态。
      - run: psql -v ON_ERROR_STOP=1 -c 'CREATE DATABASE gengyun_community_test' && node tests/integration/community-pg.mjs
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: gengyun_ci_owner
          PGPASSWORD: synthetic-ci-owner-only
          PGDATABASE: gengyun_ci_bootstrap
          COMMUNITY_PG_TEST_URL: postgres://gengyun_ci_owner:synthetic-ci-owner-only@127.0.0.1:5432/gengyun_community_test
      # 社区域**列表筛选**（#15 的残留缺口，R29-S13）：库名硬钉 `gengyun_community_filter_test`，
      # 同样要求空库；只 apply 0001+0022（与上一步同一套表），但**不共享库/角色状态**。
      # 它取的是 `GET /posts` 三类筛选的真库读数 + 「筛选未下推 SQL」的语句读数 + `feed_idx` 的 EXPLAIN 读数；
      # 缺 `COMMUNITY_FILTER_PG_TEST_URL` 时脚本打印 SKIP 并 exit 77 ⇒ 本 step 必红（⛔ 不传任何放宽开关）。
      - run: psql -v ON_ERROR_STOP=1 -c 'CREATE DATABASE gengyun_community_filter_test' && node tests/integration/community-filter-pg.mjs
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: gengyun_ci_owner
          PGPASSWORD: synthetic-ci-owner-only
          PGDATABASE: gengyun_ci_bootstrap
          COMMUNITY_FILTER_PG_TEST_URL: postgres://gengyun_ci_owner:synthetic-ci-owner-only@127.0.0.1:5432/gengyun_community_filter_test
      # 问答引用可溯源（#12 / I12，R31 接入）：库名硬钉 `gengyun_qa_citations_test`，脚本要求**空库**
      # （`qa-citations-pg.mjs:297` 断言 `public` 下 0 张表），并自己 apply 迁移**子集**
      # 0001/0002/0005/0008/0010/0012/0013 七段（`:60`；⛔ 不是 `discoverMigrations()` 全链），
      # 再断言子集二连跑 `applied=[]`（`:301-303`）。
      # 它锁的是只有真库能证明的性质：引用行必须能反算回知识片段、`rejected`/`expired` 行 0 可见、
      # 零命中必拒答（端口 `items=[]` ⇒ 端到端 `insufficient`/`passed`、零引用）、落库口径与端口口径逐字相同。
      # 连接串只走 **env**（`QA_CITATIONS_PG_TEST_URL`）：未设时脚本打印 SKIP 并以 77 退出 ⇒ 缺库必红
      # （77 是「未取得」，⛔ 不是通过；本 workflow 不传任何放宽开关，下面再把 77 显式升级成硬失败）。
      # 位置：紧跟社区域——同属「自建专用空库 + 只 apply 需要的迁移 + 全程库 owner」，不建组角色、
      # 也不复用别人的运行时角色 ⇒ 对前后脚本零耦合。
      # 本地取证（PG 17.11 + 空库 + 库 owner，exit=0）：`qa-citations-pg：8 条读数全部通过`。
      - name: 问答引用可溯源（#12 / 迁移子集 7 段 / 引用反算对账 / 零命中必拒答）
        run: |
          set -euo pipefail
          log=/tmp/qa-citations-pg.log
          psql -v ON_ERROR_STOP=1 -c 'CREATE DATABASE gengyun_qa_citations_test'
          rc=0
          node tests/integration/qa-citations-pg.mjs 2>&1 | tee "$log" || rc=$?
          if [ "$rc" -eq 77 ]; then
            echo "::error::问答引用可溯源臂被跳过（exit 77）：连接串 env 传丢了，或脚本的跳过判据被改过。77 = 未取得，不是通过。"
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::问答引用可溯源臂失败（exit $rc）。"
            exit "$rc"
          fi
          readings=$(awk '/^PASS /{n++} END{print n+0}' "$log")
          echo "PASS 读数：${readings} 条"
          if [ "$readings" -lt 1 ]; then
            echo "::error::问答引用可溯源臂 exit 0 却一条 PASS 都没有 ⇒ 等于没跑（0 条断言不是通过）。"
            exit 1
          fi
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: gengyun_ci_owner
          PGPASSWORD: synthetic-ci-owner-only
          PGDATABASE: gengyun_ci_bootstrap
          QA_CITATIONS_PG_TEST_URL: postgres://gengyun_ci_owner:synthetic-ci-owner-only@127.0.0.1:5432/gengyun_qa_citations_test
      # 消息域（#17，R27-S4）：库名硬钉 `gengyun_messages_test`，脚本同样断言 public 下无表。
      # 该脚本的连接串走**argv**（`node <脚本> <owner url>`）而不是 env——URL 写在命令行末尾，
      # 上面那几个 PG* 环境变量只给 `psql` 建库用（脚本自己从不读它们）。
      - run: psql -v ON_ERROR_STOP=1 -c 'CREATE DATABASE gengyun_messages_test' && node tests/integration/messages-pg.mjs postgres://gengyun_ci_owner:synthetic-ci-owner-only@127.0.0.1:5432/gengyun_messages_test
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: gengyun_ci_owner
          PGPASSWORD: synthetic-ci-owner-only
          PGDATABASE: gengyun_ci_bootstrap
      # 收藏／历史域（#16，R27-S4）：库名硬钉 `gengyun_favorites_history_test`，同样要求空库；
      # 连接串走 env（`FAVORITES_HISTORY_PG_TEST_URL`），未设时脚本打印 SKIP 并以 77 退出 ⇒ 缺库必红。
      - run: psql -v ON_ERROR_STOP=1 -c 'CREATE DATABASE gengyun_favorites_history_test' && node tests/integration/favorites-history-pg.mjs
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: gengyun_ci_owner
          PGPASSWORD: synthetic-ci-owner-only
          PGDATABASE: gengyun_ci_bootstrap
          FAVORITES_HISTORY_PG_TEST_URL: postgres://gengyun_ci_owner:synthetic-ci-owner-only@127.0.0.1:5432/gengyun_favorites_history_test
      # 账号注销域（I19，R28-S14）：库名硬钉 `gengyun_deletion_test`，脚本要求空库（自己断言 `public` 下无表）。
      # 该脚本自建 5 组角色 + 运行时 LOGIN，口令在脚本内 `randomBytes(24)` 生成**并写进它自己用的运行时 URL**
      # （`account-deletion-pg.mjs:95/198/381`）⇒ scram 认证下自洽；收尾逐个 `DROP ROLE` 并复核为空 ⇒ 跨 step
      # 不留角色。连接串走 **argv[2]**，上面那组 PG* 只给 `psql` 建库用（脚本从不读它们）。
      # 本地取证（PG 17.11 + scram 认证 + `gengyun_ci_owner`）：exit=0，PASS 13 组。
      - run: psql -v ON_ERROR_STOP=1 -c 'CREATE DATABASE gengyun_deletion_test' && node tests/integration/account-deletion-pg.mjs postgres://gengyun_ci_owner:synthetic-ci-owner-only@127.0.0.1:5432/gengyun_deletion_test
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: gengyun_ci_owner
          PGPASSWORD: synthetic-ci-owner-only
          PGDATABASE: gengyun_ci_bootstrap
      # 作业台域（#9，R29-S5 的臂，R31 接入）：库名硬钉 `gengyun_admin_jobs_test`，脚本要求空库（自己断言
      # `public` 下无表）。前提是**集群里还没有 `gengyun_api_runtime`**：只给 argv[2] 时脚本走
      # `provisionRoles()` 自己 `CREATE ROLE` 并把随机口令写进它自己的运行时 URL（`admin-jobs-pg.mjs:276-298`）；
      # 给了 argv[3] 反而要求该角色**已存在**（`:252-274`，存在且不是本轮创建的即拒绝接管）⇒ 这里只传 argv[2]，
      # 这是它唯一自洽的调用形态，也正好用上上一步 `account-deletion` 收尾「按 `pg_roles` 快照差集 DROP、
      # 复核为空」的结果（本机负控制：角色在时它 exit=1 且打印「拒绝接管既有角色」）。
      # 它收尾同样按开跑时 `pg_authid` 快照差集 DROP 本轮新建的角色（`:859-871`；实测跑完 `gengyun_api_runtime`
      # 计数回到 0）⇒ 不把角色留给下一步 `admin-accounts-read`（后者本来也先 `DROP IF EXISTS` 再重建，对残留
      # 容忍度最高）——这才是它排在这两步**之间**的理由，⛔ 不要挪到 `admin-accounts-read` 之后。
      # 读数：跑**全链迁移 0001→0027** 再打真 HTTP，`[M]/[P]/[A]/[J]/[C]/[E]` 六组，末行固定 `[ALL PASS]`。
      # 它没有 77 跳过分支（连不上即非 0），下面仍显式断言「末行 `[ALL PASS]` + 至少一条 `[X]` 读数」，
      # 让「exit 0 但什么都没证明」也不可能变绿。⛔ 不传任何放宽开关。
      # 本地取证（PG 17.11 + 空库 + 库 owner，exit=0）：`[X]` 读数 15 条，末行 `[ALL PASS]`。
      - name: 作业台域（#9 / 全链迁移 0001→0027 / 作业与错误可见 / 变更留痕 A→B / 最小权限）
        run: |
          set -euo pipefail
          log=/tmp/admin-jobs-pg.log
          psql -v ON_ERROR_STOP=1 -c 'CREATE DATABASE gengyun_admin_jobs_test'
          rc=0
          node tests/integration/admin-jobs-pg.mjs postgres://gengyun_ci_owner:synthetic-ci-owner-only@127.0.0.1:5432/gengyun_admin_jobs_test 2>&1 | tee "$log" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::作业台域失败（exit $rc）。"
            exit "$rc"
          fi
          readings=$(awk '/^\[[A-Z]\]/{n++} END{print n+0}' "$log")
          echo "读数：${readings} 条 [X] 注释"
          if [ "$readings" -lt 1 ] || ! grep -Fq '[ALL PASS]' "$log"; then
            echo "::error::作业台域 exit 0 但读数缺失（[X] 行=${readings}，末行 [ALL PASS] 未出现）⇒ 等于没跑。"
            exit 1
          fi
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: gengyun_ci_owner
          PGPASSWORD: synthetic-ci-owner-only
          PGDATABASE: gengyun_ci_bootstrap
      # 后台账号读取域（I18，R28-S14）：库名硬钉 `gengyun_admin_accounts_read_test`；argv[2]=owner URL、
      # argv[3]=运行时角色 URL。运行时角色的口令是脚本**从 argv[3] 解出来再 `CREATE ROLE`** 的
      # （`admin-accounts-read-pg.mjs:190-192`）⇒ scram 下自洽（argv[3] 的合成口令必须与这里逐字一致）。
      # 注意：本 step 会把 `gengyun_api_runtime` 与 6 个组角色**留在集群里**（脚本不 DROP），
      # 故它必须排在同样自建角色的 `account-deletion` 之后（后者要求角色不存在且收尾会清空）。
      # 本地取证（PG 17.11 + scram + `gengyun_ci_owner`）：exit=0，迁移三连/最小权限/HTTP 全过。
      - run: psql -v ON_ERROR_STOP=1 -c 'CREATE DATABASE gengyun_admin_accounts_read_test' && node tests/integration/admin-accounts-read-pg.mjs postgres://gengyun_ci_owner:synthetic-ci-owner-only@127.0.0.1:5432/gengyun_admin_accounts_read_test postgres://gengyun_api_runtime:synthetic-ci-runtime-only@127.0.0.1:5432/gengyun_admin_accounts_read_test
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: gengyun_ci_owner
          PGPASSWORD: synthetic-ci-owner-only
          PGDATABASE: gengyun_ci_bootstrap
      # 全局开关域（I18，R28-S14）：库名硬钉 `gengyun_flags_test`；**只给 argv[2]**（owner URL）。
      # argv[3] 省略时脚本自己 `CREATE`/`ALTER` 运行时角色、把随机口令写进它自己的 URL
      # （`admin-flags-pg.mjs:249-262`）⇒ scram 下自洽；若给了 argv[3]，脚本会跳过角色创建、直接拿 URL 连
      # （角色必须已存在）。所以这一条只传一个参数——这是它唯一自洽的调用形态。
      # 本地取证（PG 17.11 + scram + `gengyun_ci_owner`）：exit=0，`[H]` 等锁 4007ms ⇒ 504 PROVIDER_TIMEOUT。
      - run: psql -v ON_ERROR_STOP=1 -c 'CREATE DATABASE gengyun_flags_test' && node tests/integration/admin-flags-pg.mjs postgres://gengyun_ci_owner:synthetic-ci-owner-only@127.0.0.1:5432/gengyun_flags_test
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: gengyun_ci_owner
          PGPASSWORD: synthetic-ci-owner-only
          PGDATABASE: gengyun_ci_bootstrap
      # 标签 OCR 域（#323 / I10，R28-S17）：库名硬钉 `gengyun_ocr_jobs_test`，脚本同样要求**空库**
      # （自己断言 `public` 下 0 张表），并用 `discoverMigrations()` 跑**全链迁移**（0001..0024，含本片的
      # 0024）而不是子集——因此它顺带守住「迁移清单连续无缺号、总数 === 最大版本号、0024 仍在末位」。
      # 连接串走 **env**（`OCR_PG_TEST_URL`）：未设时脚本打印 SKIP 并以 77 退出 ⇒ 缺库必红（77 不是通过）。
      # 本地取证（PG 17.11 + 空库）：exit=0，`共 27 条 PASS`（含关连接重开逐字节仍在 + 子进程重启臂）。
      - run: psql -v ON_ERROR_STOP=1 -c 'CREATE DATABASE gengyun_ocr_jobs_test' && node tests/integration/ocr-jobs-pg.mjs
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: gengyun_ci_owner
          PGPASSWORD: synthetic-ci-owner-only
          PGDATABASE: gengyun_ci_bootstrap
          OCR_PG_TEST_URL: postgres://gengyun_ci_owner:synthetic-ci-owner-only@127.0.0.1:5432/gengyun_ocr_jobs_test
      # OCR 校正台账域（#10 / I10，R31 接入）：库名硬钉 `gengyun_ocr_corrections_test`，脚本要求**空库**
      # （先断言 `public` 下无表，再自己 `applyMigrations` 全链后落夹具）。它只主张四件事：
      # ① 校正台账真的落进 `ocr_records.verification->'correction_log'`（条数/actor 逐字）且 `raw_fields`
      #    一个字节都没被改写；② 关连接、新 Pool、新 store 重开 ⇒ 台账与原文都还在（append-only 的持久性）；
      # ③ 契约投影：HTTP 面仍是**五字段**、`correction_log` 不外泄；④ 负控制真能红（库侧改写 `raw_fields`
      #    ⇒ 抛「原文被覆盖」，原样写回后复绿）。
      # 连接串只走 **env**（`OCR_PG_TEST_URL`——与上一步同名，但两步各用自己的库、不共享 step env）：
