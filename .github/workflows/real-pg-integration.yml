      # 消息域注销**行数**（`#17` 消息域注销，`#405`／W11 的脚本 `messages-purge-pg.mjs`，R29-W13 接入）：
      # 与上两步同属**自起集群**类——自己 `initdb` 出临时 17 集群（端口 55700–55999 且**先探活再起**）、
      # 只监听 127.0.0.1、自建 `gengyun_messages_purge_test`、跑完 `pg_ctl stop` 并删数据目录，**不**连 service
