      # 备份副本域（GY-I19 / #19，R28-S49）：**自起集群**脚本之一。
      # runner 上原本没有 17 的服务端二进制（`postgres:17.11` 只活在 service 容器内），故先一步用 PGDG apt
      # 装 `postgresql-17` 取 `initdb`/`pg_ctl`，再真跑。**装包只有这一步**：R28-E5 接的 `backup-copies-purge-pg`
      # 复用同一份 bin（同一类脚本、同一套 env），⛔ 不装第二遍（两个包管理器状态互相覆盖是新的失败源）。
      # 它**不**连 service 里那个库、CI 里也**不** `CREATE DATABASE`：库名硬钉在脚本自己的临时集群里
