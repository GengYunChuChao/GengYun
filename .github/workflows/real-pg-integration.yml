      # `/usr/lib/postgresql/17/bin`（装包只做一次），且同样**不** `CREATE DATABASE`。
      # ⚠️ 它与上两步有一处**必须照脚本写**的差异：数据根目录键是 `GY_W11_PG_ROOT`（脚本 `:92`），
      # ⛔ 不是 `GY_I19_PG_ROOT`。抄上一步的键只会多一条**装饰性 env**——step 里看着有 root，脚本照样回落
