      # **自起集群**类，因此复用上一步装出来的 `/usr/lib/postgresql/17/bin`、且同样**不** `CREATE DATABASE`。
      # 差异只在脚本内部：它 `initdb` 出**另一个**临时集群（端口 55600+randomInt(0,300)，且**先探活再起**——
