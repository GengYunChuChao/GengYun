      - run: psql -v ON_ERROR_STOP=1 -c 'CREATE DATABASE gengyun_suspend_test' && node tests/integration/account-suspend-pg.mjs postgres://gengyun_ci_owner:synthetic-ci-owner-only@127.0.0.1:5432/gengyun_suspend_test
