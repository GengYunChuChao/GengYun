# 真库臂（real PostgreSQL 17.11）· 把「已在 main、却没有任何 workflow 跑过」的集成脚本接进 CI：
#   · tests/integration/conversations-pg.mjs（#313 / I12）
#   · tests/integration/community-pg.mjs（#296 / I15）
#   · tests/integration/messages-pg.mjs（#17 / I17）；R27-S4 追加
#   · tests/integration/favorites-history-pg.mjs（#16 / I16）；R27-S4 追加
#   · tests/integration/backup-copies-purge-pg.mjs（#19 / GY-I19 的 P0-4 执行者）；R28-E5 追加
#
# 为什么这些脚本**必须**真库：它们锁的是只有数据库能证明的性质——迁移子集按序 apply 且二连跑
# 0 条、唯一键真的能裁决并发、外键真的挡孤儿行、枚举/CHECK 真的拒绝闭集外的值、
# `catalog_read.current_knowledge` 真的带 `created_at`、以及 `buildApp` 在有真库时真的开启对应域。
# 内存库与替身证明不了这些；而 CI 里没有真库的「跳过」等于这一轮什么都没验证。
# 消息域与收藏历史域（R27-S4 追加的两条）同属这一类：`messages.revision` 只能由一条原子 UPDATE
# 推进、重复写由唯一约束裁决、未读数是每次现算的派生量；收藏/历史的去重同样由唯一键裁决、
# CAS 删除的三档错误码与「幂等台账真落库、能被另一条独立连接写入唤醒」也只有真库能证明。
#
# 为什么缺库必须**红**（而不是「跳过」）：带「缺前置 ⇒ 打印 SKIP」分支的那几个（会话链／社区域／
# 收藏历史／标签 OCR 域）**以 77 退出**（POSIX skipped＝未取得，不是通过；仓内
# `tests/unit/integration-script-coverage.test.mjs` 的「整链跳过必须给 77」把它固化成硬约定）；
# messages-pg 没有跳过分支——缺 argv 就退回默认端口、连不上即非 0 失败。两条都不是「通过」。
# 另一条独立约束：本 workflow **不设**任何放宽开关、也**不传**任何跳过参数：
# 真库没起来（service 未健康、库没建出来、连接串写错）⇒ 脚本 77 或非 0 ⇒ 本 job 红。
# 这个红是**正确的读数**：它说的是「真库臂这一轮没有验证」，不是「验证通过」。
# 反过来，把放宽开关写进 workflow 就会让「0 条断言」被读成绿 ——
# `tests/unit/ci-real-pg-wiring.test.mjs` 对任何 workflow 里出现这类开关一律判红。
#
# 库的分配：每个脚本各自**硬钉**库名且要求**空库**（脚本开头断言 public 下没有任何表），因此不能
# 共用一个库；`services.postgres` 只按 `POSTGRES_DB` 建一个库，故每个 step 先用 runner 上已有的
# `psql` 建**专用空库**，再真跑该脚本（形状照抄 `.github/workflows/consent-grant-postgres.yml`）。
# `POSTGRES_DB` 那一份只当 psql 的连接靴库用，脚本从不连它。
#
# 口令是**明显的合成值**（`synthetic-ci-owner-only`），与其它 PG workflow 同值；不含任何真实凭据。

name: Real PostgreSQL integration gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  real-pg-17-11:
    name: real-pg-17.11
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: gengyun_ci_bootstrap
          POSTGRES_USER: gengyun_ci_owner
          POSTGRES_PASSWORD: synthetic-ci-owner-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      # 会话链（#313）：库名硬钉 `gengyun_conversations_test`，脚本自己断言 public 下无表。
      # `&&` 串联保证「建库失败」不会滑过去变成「脚本 77 也算跑过」——两步都必须成功。
      - run: psql -v ON_ERROR_STOP=1 -c 'CREATE DATABASE gengyun_conversations_test' && node tests/integration/conversations-pg.mjs
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: gengyun_ci_owner
          PGPASSWORD: synthetic-ci-owner-only
          PGDATABASE: gengyun_ci_bootstrap
          CONVERSATIONS_PG_TEST_URL: postgres://gengyun_ci_owner:synthetic-ci-owner-only@127.0.0.1:5432/gengyun_conversations_test
      # 社区域（#296）：库名硬钉 `gengyun_community_test`，同样要求空库；顺序在会话链之后，
      # 两者不共享任何库/角色状态。
      - run: psql -v ON_ERROR_STOP=1 -c 'CREATE DATABASE gengyun_community_test' && node tests/integration/community-pg.mjs
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: gengyun_ci_owner
          PGPASSWORD: synthetic-ci-owner-only
          PGDATABASE: gengyun_ci_bootstrap
          COMMUNITY_PG_TEST_URL: postgres://gengyun_ci_owner:synthetic-ci-owner-only@127.0.0.1:5432/gengyun_community_test
      # 消息域（#17，R27-S4）：库名硬钉 `gengyun_messages_test`，脚本同样断言 public 下无表。
      # 该脚本的连接串走**argv**（`node <脚本> <owner url>`）而不是 env——URL 写在命令行末尾，
      # 上面那几个 PG* 环境变量只给 `psql` 建库用（脚本自己从不读它们）。
      - run: psql -v ON_ERROR_STOP=1 -c 'CREATE DATABASE gengyun_messages_test' && node tests/integration/messages-pg.mjs postgres://gengyun_ci_owner:synthetic-ci-owner-only@127.0.0.1:5432/gengyun_messages_test
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: gengyun_ci_owner
          PGPASSWORD: synthetic-ci-owner-only
          PGDATABASE: gengyun_ci_bootstrap
      # 收藏／历史域（#16，R27-S4）：库名硬钉 `gengyun_favorites_history_test`，同样要求空库；
      # 连接串走 env（`FAVORITES_HISTORY_PG_TEST_URL`），未设时脚本打印 SKIP 并以 77 退出 ⇒ 缺库必红。
      - run: psql -v ON_ERROR_STOP=1 -c 'CREATE DATABASE gengyun_favorites_history_test' && node tests/integration/favorites-history-pg.mjs
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: gengyun_ci_owner
          PGPASSWORD: synthetic-ci-owner-only
          PGDATABASE: gengyun_ci_bootstrap
          FAVORITES_HISTORY_PG_TEST_URL: postgres://gengyun_ci_owner:synthetic-ci-owner-only@127.0.0.1:5432/gengyun_favorites_history_test
      # 账号注销域（I19，R28-S14）：库名硬钉 `gengyun_deletion_test`，脚本要求空库（自己断言 `public` 下无表）。
      # 该脚本自建 5 组角色 + 运行时 LOGIN，口令在脚本内 `randomBytes(24)` 生成**并写进它自己用的运行时 URL**
      # （`account-deletion-pg.mjs:95/198/381`）⇒ scram 认证下自洽；收尾逐个 `DROP ROLE` 并复核为空 ⇒ 跨 step
      # 不留角色。连接串走 **argv[2]**，上面那组 PG* 只给 `psql` 建库用（脚本从不读它们）。
      # 本地取证（PG 17.11 + scram 认证 + `gengyun_ci_owner`）：exit=0，PASS 13 组。
      - run: psql -v ON_ERROR_STOP=1 -c 'CREATE DATABASE gengyun_deletion_test' && node tests/integration/account-deletion-pg.mjs postgres://gengyun_ci_owner:synthetic-ci-owner-only@127.0.0.1:5432/gengyun_deletion_test
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: gengyun_ci_owner
          PGPASSWORD: synthetic-ci-owner-only
          PGDATABASE: gengyun_ci_bootstrap
      # 后台账号读取域（I18，R28-S14）：库名硬钉 `gengyun_admin_accounts_read_test`；argv[2]=owner URL、
      # argv[3]=运行时角色 URL。运行时角色的口令是脚本**从 argv[3] 解出来再 `CREATE ROLE`** 的
      # （`admin-accounts-read-pg.mjs:190-192`）⇒ scram 下自洽（argv[3] 的合成口令必须与这里逐字一致）。
      # 注意：本 step 会把 `gengyun_api_runtime` 与 6 个组角色**留在集群里**（脚本不 DROP），
      # 故它必须排在同样自建角色的 `account-deletion` 之后（后者要求角色不存在且收尾会清空）。
      # 本地取证（PG 17.11 + scram + `gengyun_ci_owner`）：exit=0，迁移三连/最小权限/HTTP 全过。
      - run: psql -v ON_ERROR_STOP=1 -c 'CREATE DATABASE gengyun_admin_accounts_read_test' && node tests/integration/admin-accounts-read-pg.mjs postgres://gengyun_ci_owner:synthetic-ci-owner-only@127.0.0.1:5432/gengyun_admin_accounts_read_test postgres://gengyun_api_runtime:synthetic-ci-runtime-only@127.0.0.1:5432/gengyun_admin_accounts_read_test
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: gengyun_ci_owner
          PGPASSWORD: synthetic-ci-owner-only
          PGDATABASE: gengyun_ci_bootstrap
      # 全局开关域（I18，R28-S14）：库名硬钉 `gengyun_flags_test`；**只给 argv[2]**（owner URL）。
      # argv[3] 省略时脚本自己 `CREATE`/`ALTER` 运行时角色、把随机口令写进它自己的 URL
      # （`admin-flags-pg.mjs:249-262`）⇒ scram 下自洽；若给了 argv[3]，脚本会跳过角色创建、直接拿 URL 连
      # （角色必须已存在）。所以这一条只传一个参数——这是它唯一自洽的调用形态。
      # 本地取证（PG 17.11 + scram + `gengyun_ci_owner`）：exit=0，`[H]` 等锁 4007ms ⇒ 504 PROVIDER_TIMEOUT。
      - run: psql -v ON_ERROR_STOP=1 -c 'CREATE DATABASE gengyun_flags_test' && node tests/integration/admin-flags-pg.mjs postgres://gengyun_ci_owner:synthetic-ci-owner-only@127.0.0.1:5432/gengyun_flags_test
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: gengyun_ci_owner
          PGPASSWORD: synthetic-ci-owner-only
          PGDATABASE: gengyun_ci_bootstrap
      # 标签 OCR 域（#323 / I10，R28-S17）：库名硬钉 `gengyun_ocr_jobs_test`，脚本同样要求**空库**
      # （自己断言 `public` 下 0 张表），并用 `discoverMigrations()` 跑**全链迁移**（0001..0024，含本片的
      # 0024）而不是子集——因此它顺带守住「迁移清单连续无缺号、总数 === 最大版本号、0024 仍在末位」。
      # 连接串走 **env**（`OCR_PG_TEST_URL`）：未设时脚本打印 SKIP 并以 77 退出 ⇒ 缺库必红（77 不是通过）。
      # 本地取证（PG 17.11 + 空库）：exit=0，`共 27 条 PASS`（含关连接重开逐字节仍在 + 子进程重启臂）。
      - run: psql -v ON_ERROR_STOP=1 -c 'CREATE DATABASE gengyun_ocr_jobs_test' && node tests/integration/ocr-jobs-pg.mjs
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: gengyun_ci_owner
          PGPASSWORD: synthetic-ci-owner-only
          PGDATABASE: gengyun_ci_bootstrap
          OCR_PG_TEST_URL: postgres://gengyun_ci_owner:synthetic-ci-owner-only@127.0.0.1:5432/gengyun_ocr_jobs_test
      # 识别域持久化（#333 / I10，R28-S36）：库名硬钉 `gengyun_recognitions_test`，脚本同样要求**空库**
      # （第一步断言 `public` 下 0 张表）。它自己 `discoverMigrations()` 后先跑「除 0025 外全部迁移」再应用 0025，
      # 并断言迁移清单连续无缺号、总数 === 最大编号 ⇒ 顺带守住迁移清单不变量（与 ocr-jobs step 同构）。
      # 连接串只走 **env**（`RECOGNITIONS_PG_TEST_URL`，脚本按属主身份连库、自己从不建角色）：
      # 未设时脚本打印 SKIP 并以 77 退出 ⇒ 缺库必红（77 不是通过，也不加任何吞红开关）。
      # 本地取证（PG 17.11 + 空库 + `gengyun_ci_owner` 属主）：exit=0，`共 30 条 PASS，耗时 1777ms`。
      - run: psql -v ON_ERROR_STOP=1 -c 'CREATE DATABASE gengyun_recognitions_test' && node tests/integration/recognitions-pg.mjs
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: gengyun_ci_owner
          PGPASSWORD: synthetic-ci-owner-only
          PGDATABASE: gengyun_ci_bootstrap
          RECOGNITIONS_PG_TEST_URL: postgres://gengyun_ci_owner:synthetic-ci-owner-only@127.0.0.1:5432/gengyun_recognitions_test
      # 账号停用/恢复域（I22 / R28-S39）：库名硬钉 `gengyun_suspend_test`，脚本按「**空库**」前提跑
      # （它自己 apply 0001–0017、再把 0017 单独跑 UP/ROLLBACK/REPLAY 三连；非空库会在首个 `CREATE` 撞车 ⇒ 必红），
      # 故与既有 11 步同形：`psql -c 'CREATE DATABASE …' && node <脚本>`。
      # argv 只给 owner URL——省略 argv[3] 时脚本自建/改 `gengyun_api_runtime` 并用随机口令派生运行时 URL，
      # scram-sha-256 下自洽；旧版「口令割裂 ⇒ 28P01」的缺陷已由 R28-S15 修掉
      # （`docs/verification/gy-r28-account-suspend-scram-20261020.md`）。
      # 它自己 apply 迁移，故不需要额外准备；收尾会 DROP 它自建的角色（`cleanup()`）；排在 `admin-accounts-read` 之后时，
      # 前面留下的同名角色它用 `ALTER ROLE` 复用，不会再 42710。
      # 本地取证（PG 17.11 + scram + `gengyun_ci_owner` 超级用户）：exit=0，四臂 [M]/[P]/[A-D]/[E-F] 齐全，末行 `ALL PASS`。
      - run: psql -v ON_ERROR_STOP=1 -c 'CREATE DATABASE gengyun_suspend_test' && node tests/integration/account-suspend-pg.mjs postgres://gengyun_ci_owner:synthetic-ci-owner-only@127.0.0.1:5432/gengyun_suspend_test
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: gengyun_ci_owner
          PGPASSWORD: synthetic-ci-owner-only
          PGDATABASE: gengyun_ci_bootstrap
      # 语音转写域（#351 / R28-S40）：库名硬钉 `gengyun_speech_test`，脚本同样要求**空库**
      # （自己断言 `public` 下 0 张表），并用 `discoverMigrations()` 跑**全链迁移**（0001..0026，含本片的
      # 0026_speech_persistence.sql）；随后做 0026 的 UP／ROLLBACK／REPLAY ⇒ 顺带守住迁移清单不变量。
      # 连接串走 **env**（`SPEECH_PG_TEST_URL`）：未设时脚本打印 SKIP 并以 77 退出 ⇒ 缺库必红（77 不是通过）。
      # 位置排最后：它自建专用空库、自己 apply 迁移，不建组角色、也不复用别人的运行时角色 ⇒ 对前后无耦合。
      # 本地取证（PG 17.11 + scram + 空库）：exit=0，`共 30 条 PASS`（含关连接重开逐字节仍在 + 子进程重启臂）。
      - run: psql -v ON_ERROR_STOP=1 -c 'CREATE DATABASE gengyun_speech_test' && node tests/integration/speech-pg.mjs
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: gengyun_ci_owner
          PGPASSWORD: synthetic-ci-owner-only
          PGDATABASE: gengyun_ci_bootstrap
          SPEECH_PG_TEST_URL: postgres://gengyun_ci_owner:synthetic-ci-owner-only@127.0.0.1:5432/gengyun_speech_test
      # 媒体持久化（#6 / #16，R28-W12）：库名硬钉 `gengyun_media_test`，脚本按**空库**前提跑——
      # 库里没有 `public.media` 时它自己 `applyMigrations(discoverMigrations())`（与 `npm run db:migrate`
      # 同一条代码路径，写 `schema_migrations` 台账与校验和），非空库则原样复用，因此不需要额外准备步骤。
      # 覆盖：四表 + 0008 台账形状 → 三段式上传（`object_ref_cipher` 是密文信封）→ owner 逐字节读 →
      # 非 owner NOT_FOUND → 同一幂等键重复 complete **行数不变** → **子进程真重启**后同 uploadId 仍可读 →
      # real 装配缺 `MEDIA_OBJECT_REF_KEY` 时整域 503（fail-closed）→ 空仓储负控制。
      # 连接串走 argv[2]，与 suspend step 同形；省略时脚本回落到本机 `:55683`，且**只允许回环地址**。
      # 本地取证（PG 17.11 + 空库 + 属主等价 `gengyun_ci_owner`）：exit=0，`17 条读数，全部断言通过`。
      - run: psql -v ON_ERROR_STOP=1 -c 'CREATE DATABASE gengyun_media_test' && node tests/integration/media-persistence-pg.mjs postgres://gengyun_ci_owner:synthetic-ci-owner-only@127.0.0.1:5432/gengyun_media_test
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: gengyun_ci_owner
          PGPASSWORD: synthetic-ci-owner-only
          PGDATABASE: gengyun_ci_bootstrap
      # 备份副本域（GY-I19 / #19，R28-S49）：**自起集群**脚本之一。
      # runner 上原本没有 17 的服务端二进制（`postgres:17.11` 只活在 service 容器内），故先一步用 PGDG apt
      # 装 `postgresql-17` 取 `initdb`/`pg_ctl`，再真跑。**装包只有这一步**：R28-E5 接的 `backup-copies-purge-pg`
      # 复用同一份 bin（同一类脚本、同一套 env），⛔ 不装第二遍（两个包管理器状态互相覆盖是新的失败源）。
      # 它**不**连 service 里那个库、CI 里也**不** `CREATE DATABASE`：库名硬钉在脚本自己的临时集群里
      # （`DB_NAME = gengyun_backup_purge_test`，端口 55500+randomInt(0,500)、只监听 127.0.0.1、跑完自删数据目录）。
      # 未设 `GY_PG_BIN` 时脚本打印 SKIP 并 exit 77 ⇒ 装包/路径没弄好必红（77 不是通过，也不加任何吞红开关）。
      # 本地取证（本机 PG 17.11 二进制 + 临时数据目录）：exit=0，`RESULT=PASS 13 组`，末行 `CLEANUP=done`。
      #
      # 钉的是**来源**，不是某个小版本：`apt.postgresql.org` 的 `noble-pgdg`（ubuntu-24.04 的官方 PGDG suite，
      # 2026-10-19 仍在线）+ 包名钉死大版本 `postgresql-17`。⛔ 不写 `postgresql-17=17.11-…`：PGDG 只保留每个
      # 大版本的最新小版本，写死小版本会在 17.12 发布当天变成「依赖无法满足」——那是另一种假门禁（步骤永远红）。
      # 作为交换，装完**断言大版本真的是 17**：装错了大版本 ⇒ 本步立刻红，而不是等脚本在 initdb 处神秘失败。
      - name: 安装 PG 17 服务端二进制（backup-purge / backup-copies / messages-purge 需要 initdb/pg_ctl）
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-17
          initdb_version=$(/usr/lib/postgresql/17/bin/initdb --version)
          echo "$initdb_version"
          /usr/lib/postgresql/17/bin/pg_ctl --version
          server_major=$(printf '%s\n' "$initdb_version" | sed -e 's/.*(PostgreSQL) \([0-9][0-9]*\)\..*/\1/')
          if [ "$server_major" != "17" ]; then
            echo "::error::装出来的服务端不是 17（initdb 报 $initdb_version）⇒ 两个自起集群脚本会拿到错的大版本，真库臂等于没验证。"
            exit 1
          fi
      - name: 备份副本域（迁移 0023 / 受理同事务 / 30 天清除）
        run: node tests/integration/backup-purge-pg.mjs
        env:
          GY_PG_BIN: /usr/lib/postgresql/17/bin
          GY_I19_PG_ROOT: ${{ runner.temp }}/gy-i19-pg
          PGCLIENTENCODING: UTF8
      # 备份副本**到期清除驱动**（GY-I19 / #19 的 P0-4 执行者，R28-E5 / #398 的脚本）：与上一步同属
      # **自起集群**类，因此复用上一步装出来的 `/usr/lib/postgresql/17/bin`、且同样**不** `CREATE DATABASE`。
      # 差异只在脚本内部：它 `initdb` 出**另一个**临时集群（端口 55600+randomInt(0,300)，且**先探活再起**——
      # 本机实测 556xx 里已经有 8 个别人的临时集群在监听，随机端口不能假设空闲）、自建
      # `DB_NAME = gengyun_backup_purge_driver_test`、只监听 127.0.0.1、跑完 `pg_ctl stop` 并删数据目录。
      # 它自证 14 条（权限形状／到期边界／批量上限／失败留痕与重排／幂等重跑／CLI 退出码），缺 `GY_PG_BIN`
      # 时打印 SKIP 并 exit 77 ⇒ 装包或路径没弄好必红（77 是「未取得」，⛔ 不是通过，也不加任何吞红开关）。
      # 排在 `backup-purge` 之后、`recognition-chain` 之前的理由：它只依赖那条装包 step，对 service 里的库、
      # 口令与角色零依赖（自己不建组角色、不碰 service 集群），故对前后脚本都无前提。
      # 本地取证（本机 PG 17.11 二进制 + 独立临时数据目录）：exit=0，`PASS 1..14` + 末行 `ALL PASS：14 条真库断言`。
      - name: 备份副本到期清除驱动（迁移 0023 / 到期枚举 / 逐组清除 / 失败重排 / CLI 幂等）
        run: node tests/integration/backup-copies-purge-pg.mjs
        env:
          GY_PG_BIN: /usr/lib/postgresql/17/bin
          GY_I19_PG_ROOT: ${{ runner.temp }}/gy-i19-pg
          PGCLIENTENCODING: UTF8
      # 消息域注销**行数**（`#17` 消息域注销，`#405`／W11 的脚本 `messages-purge-pg.mjs`，R29-W13 接入）：
      # 与上两步同属**自起集群**类——自己 `initdb` 出临时 17 集群（端口 55700–55999 且**先探活再起**）、
      # 只监听 127.0.0.1、自建 `gengyun_messages_purge_test`、跑完 `pg_ctl stop` 并删数据目录，**不**连 service
      # 里的库、**不**建组角色、**不**碰集群级对象 ⇒ 对前后脚本零耦合；复用上一步装出来的
      # `/usr/lib/postgresql/17/bin`（装包只做一次），且同样**不** `CREATE DATABASE`。
      # ⚠️ 它与上两步有一处**必须照脚本写**的差异：数据根目录键是 `GY_W11_PG_ROOT`（脚本 `:92`），
      # ⛔ 不是 `GY_I19_PG_ROOT`。抄上一步的键只会多一条**装饰性 env**——step 里看着有 root，脚本照样回落
      # `os.tmpdir()`，数据目录落在共享 tmp（本机实测：那样 initdb 会因 tmp 目录 ACL 直接失败）。守卫自
      # R29-W13 起按脚本映射键名（`SELF_CLUSTERED_ROOT_KEY`）并与脚本源码真值交叉核对，给错键即红。
      # 它自证 8 条（授权形状／消息与台账行数／他人零影响／负控制／幂等重放／回执），缺 `GY_PG_BIN` 时打印
      # SKIP 并 exit 77 ⇒ 装包或路径没弄好必红（77 是「未取得」，⛔ 不是通过，也不加任何吞红开关）。
      # 排在 `recognition-chain-e2e` **之前**：后者是唯一起 loopback 监听并反复轮询异步落库的最慢一步，
      # 且它的 step 注释与 `REQUIRED_STEP_ORDER` 都要求它仍排最后（别把它的读秒和别人的失败混在一起）。
      # 本地取证（本机 PG 17.11 二进制 + 独立临时数据目录 `E:\GengYunCommander\.pg17\tmp\w13-w11`）：
      # exit=0，`PASS 1..8` + 末行 `ALL PASS：8 条真库断言`，端口 55766，无残留下游。
      - name: 消息域注销行数（#17 / 迁移 0019 messages + 0008 idempotency_keys）
        run: node tests/integration/messages-purge-pg.mjs
        env:
          GY_PG_BIN: /usr/lib/postgresql/17/bin
          GY_W11_PG_ROOT: ${{ runner.temp }}/gy-w11-pg
          PGCLIENTENCODING: UTF8
      # 识别端到端链路（GY-I06／I08／I09／I10，R28-S65）：库名硬钉 `gengyun_recognition_chain_test`，
      # 脚本同样要求**空库**（`preparePg()` 先数 `public` 下的表，非 0 直接断言失败）。
      # 它跑的是仓内**唯一**的完整业务链路：上传识别 → 拿到结果 → 看可信度与理由 → 加入识别历史 →
      # 从历史读回 → 删除历史 → 再读为空；全程 loopback 真 HTTP（脚本内 `app.listen({host:'127.0.0.1', port:0})`）。
      # 与前面那些「全链迁移」step 不同：真库臂只 apply 它需要的两段（0001 身份 + 0018 历史），
      # 并断言「恰好应用一次、重复应用 no-op」——⛔ 不要照抄成 `discoverMigrations()` 全链。
      # 连接串只走 **env**（`RECOGNITION_CHAIN_PG_TEST_URL`）：全程库 owner 身份，脚本自己从不建角色、
      # 也不复用别人的运行时角色 ⇒ 对前后 step 零耦合，故排**最后**。
      # 缺 env 时脚本会打印 SKIP 并 exit 77。本 workflow 里这个 env 是我们自己传的，77 因此只可能意味着
      # 「env 传丢了」或「脚本把跳过判据改过」⇒ 下面把 77 显式升级成硬失败（`::error::` + `exit 1`），
      # 让「本步悄悄被跳过」在这条 workflow 里不可能发生。77 是「未取得」，⛔ 不是通过。
      # 非 0 且非 77 ⇒ 原样以该码退出（真跑挂了就是红）。⛔ 不加任何吞红开关／`|| true`／`set +e`。
      # 本地取证（PG 17.11 + 空库 + `gengyun_ci_owner` 属主）：exit=0，内存臂 + 真库臂双 PASS。
      - name: 识别端到端链路（上传→结果→历史→删除→读空）
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -c 'CREATE DATABASE gengyun_recognition_chain_test'
          rc=0
          node tests/integration/recognition-chain-e2e.mjs || rc=$?
          if [ "$rc" -eq 77 ]; then
            echo "::error::识别端到端链路的真库臂被跳过（exit 77）：连接串 env 传丢了，或脚本的跳过判据被改过。77 = 未取得，不是通过。"
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::识别端到端链路失败（exit $rc）。"
            exit "$rc"
          fi
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: gengyun_ci_owner
          PGPASSWORD: synthetic-ci-owner-only
          PGDATABASE: gengyun_ci_bootstrap
          RECOGNITION_CHAIN_PG_TEST_URL: postgres://gengyun_ci_owner:synthetic-ci-owner-only@127.0.0.1:5432/gengyun_recognition_chain_test
          PGCLIENTENCODING: UTF8
