      # `DB_NAME = gengyun_backup_purge_driver_test`、只监听 127.0.0.1、跑完 `pg_ctl stop` 并删数据目录。
      # 它自证 14 条（权限形状／到期边界／批量上限／失败留痕与重排／幂等重跑／CLI 退出码），缺 `GY_PG_BIN`
      # 时打印 SKIP 并 exit 77 ⇒ 装包或路径没弄好必红（77 是「未取得」，⛔ 不是通过，也不加任何吞红开关）。
