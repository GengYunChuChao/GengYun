# 部署 SQL 链门禁（R28-S34）· 把 `deploy/postgres-cvm/sql/` 的两条脚本接进 CI：
#   · `20-login-roles.sql`（运行时 LOGIN + 列级最小权限）
#   · `90-assert-least-privilege.sql`（最小权限断言；**条数不写死**——它随切片增长，以脚本自身判决为准；
#     基线 `56042f7`＝#342 合入后）
#
# 缺口（本片立项时的实测）：这两条脚本在仓内**只被** `deploy/postgres-cvm/provision-db.sh` 引用，
# 也就是「CVM 首次装库时人工/脚本执行一次」；逐 workflow 检索文件名 0 命中 ⇒ 它们写坏了（漏授一列、
# 断言被改松、迁移表名对不上）CI 一律全绿，只有上线那一刻才发现。90-assert 尤其只有真库能证明：
# 它读的是 `information_schema`／`has_*_privilege()` 的**真值**，内存库与替身都给不出这个读数。
#
# 判据（与 `tests/unit/ci-real-pg-wiring.test.mjs` 同一套口径，不另立门户）：
#   ① 真 PG **17.11**（与生产 CVM 同主版本；17 专有视图/迁移行为在 16 上会静默失真）；
#   ② 迁移必须跑**全链**（`migrate.ts up`，0001..当前末位一个都不能漏；末位以
#      `services/api/db/migrations/` 里实际最大号为准，⛔ 不在本文件里写死数字）——90-assert 断言的表/列来自迁移，
#      漏跑一个迁移会让断言「因为表不存在」而白白变红，读数就不是权限结论；
#   ③ 两个 job 分别覆盖 `provision-db.sh` 的**两种组角色形态**，组文件顺序都抄该脚本的装配顺序：
#      · `deploy-sql-17-11`（5 组）＝**生产默认形态**：`auth_privacy.sql`／`catalog_readers.sql`／
#        `consent_granter.sql`／`profile_runtime.sql`／`knowledge_runtime.sql`；
#      · `deploy-sql-17-11-cli-groups`（7 组）＝`provision-db.sh --with-cli-groups` 形态：在默认 5 组之上再
#        追加 `source_operator.sql`／`staging_importer.sql` 两份。这两份只在该开关下执行，默认部署里那两个组
#        根本不存在，所以默认 job 不建它们；7 组形态此前没有任何 workflow 跑过，本片补上那条通道。
#      `services/api/db/roles/egress_ledger.sql` 两种形态都**不执行**（`provision-db.sh` 从不 apply 它；处置见
#      `docs/verification/gy-r28-roles-file-disposition-20261021.md`：not_provisioned）⇒ 任何 workflow 都不该建
#      那个组，本文件也不建。
#      建完组再跑 `20-login-roles.sql` 建运行时 LOGIN
#      （它自身断言 `current_database() = 'gengyun'`、`gengyun_cvm_owner` 存在、口令 48 位小写十六进制，
#      故两个 job 的库名都必须是 `gengyun`，运行时口令必须是 48 位 hex）；
#   ④ 90-assert 判绿要**双保险**，因为它的两类失败各自只被其中一道抓住（实测依据在脚本头部）：
#      · **末行**（最后一条非空行）必须正好是 `ok`：它是唯一承载「判决结论」的量——通过时是 `ok`，
#        判 FAIL 时是 `FAIL: <标签> (<说明>); …` 那一行（见脚本尾部
#        `CASE … THEN 'ok' ELSE 'FAIL: ' || …`）。提取口径与生产调用方 `provision-db.sh:373`
#        （`printf '%s\n' "$assert_out" | sed '/^[[:space:]]*$/d' | tail -n1`）**逐字等价**
#        ——CI 与生产判的必须是同一个量。
#      · **`psql` 退出码**必须 0：另一类失败是「脚本没跑到判决」——缺文件、连接断、元命令/SQL 语法错、
#        或断言段（`\set ON_ERROR_STOP on`）里的 SQL 报错提前中止；这时末行会退化成
#        `CONTEXT:  PL/pgSQL function inline_code_block … at RAISE` 一类收尾行，退出码是到达得最早、
#        最干净的那一半信号。断言判 FAIL 现在也会经尾部 DO 块的 `RAISE EXCEPTION` 变成非 0
#        （hard-fail 已合入），生产调用方 `provision-db.sh:371-373` 也已是「退出码主判据 + 末行兜底」
#        的同道判法；两半互为印证，缺哪一半都还剩一个盲区。
#      注意探针段（`\set ON_ERROR_STOP off` + `SET LOCAL ROLE` + 零行语句）**故意**会打出 42501，
#      那是被验的读数、属预期——所以本步只对「末行 + 退出码」取值，⛔ 不按日志里有没有 `ERROR` 判红。
#      本步用 `set -o pipefail` ＋ 显式捕获 `$?` 兜住，两条 `::error::` 分别写清是哪一半不满足。
#   ⑤ 与 hard-fail 切片的关系（**互补，不能互相替代**）：hard-fail 切片验的是「**人为破坏后必须判红**」
#      ——把某一列授权撤销、把某条断言改松，读数必须从 `ok` 变成非 `ok`／非 0，也就是负控制；
#      本 workflow 验的是「**合规授权下必须判绿**」——正控制。少了本片，hard-fail 的红说明不了
#      「合规态是绿的」（可能一直是红的）；少了 hard-fail 片，本片的绿说明不了「断言真的会拦人」
#      （可能整段没执行）。所以本 job 只做正控制，破坏/复原的取证在 hard-fail 片与本片报告里各自留痕。
#
# ⛔ 本 job 不设任何「放宽跳过」开关、不传跳过参数、不用 step 级条件与容错开关（口径见
#   `tests/unit/ci-real-pg-wiring.test.mjs` 判据②④⑤）：缺库／缺角色／断言红都必须以**非 0** 结束，
#   那一轮就是「没有通过」，不是「跳过」。
#
# 口令是**明显的合成值**（`synthetic-ci-owner-only` / 48 位 hex 的固定串），与仓内其它 PG workflow 同风格，
# 不含任何真实凭据；service 容器与 job 同生共死，不对外暴露端口以外的东西。
#
# 本地取证（见本片报告）：Windows 本机 PG 17.11 临时集群（`initdb -E UTF8`，端口 55645）＋ Node 24.16.0，
# 同一套命令逐条真跑：全绿（末行 `ok`／退出码 0）→ 人为破坏后判失败（末行非 `ok`／退出码非 0）→ 复原后恢复绿。
# R28-S64 追加取证（7 组形态，端口 55661）：7 份角色文件与 `20-login-roles.sql` 全部 exit 0，
# 90-assert 退出码 0、末行 `ok`（条数不写死，以脚本判决为准）；读数与负控制原文见本片证据页。

name: Deploy SQL chain gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  deploy-sql-17-11:
    name: deploy-sql-17.11
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        # 库名必须是 `gengyun`：`20-login-roles.sql:94` 断言 `current_database() = 'gengyun'`，
        # 换个库名会在那一条直接 `SELECT 1/0` 红掉（不是本 job 想验的东西）。
        image: postgres:17.11
        env:
          POSTGRES_DB: gengyun
          POSTGRES_USER: gengyun_cvm_owner
          POSTGRES_PASSWORD: synthetic-ci-owner-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      # ① 全链迁移：库名与 owner 与生产同形（`gengyun` / `gengyun_cvm_owner`）。
      # `migrate.ts up` 只认 `DATABASE_URL`；连不上库即以非 0 退出（不是「跳过」）。
      - name: 迁移全链（0001..当前末位，以 migrations 目录实际最大号为准）
        run: node services/api/src/db/migrate.ts up
        env:
          DATABASE_URL: postgres://gengyun_cvm_owner:synthetic-ci-owner-only@127.0.0.1:5432/gengyun
      # ② 组角色：顺序**逐条抄** `provision-db.sh:267-273` 的 `ROLE_GROUP_FILES` 基础 5 组（同一顺序）。
      # 这里显式列文件名而不写 `roles/*.sql` 的原因：glob 的字典序会把 knowledge_runtime 排到
      # profile_runtime 之前，与生产的 apply 顺序不一致；本 job 要验的是**生产那条链**。
      # `--with-cli-groups` 才追加的是 2 份（`source_operator.sql`／`staging_importer.sql`，见
      # provision-db.sh:274-279）：本 job 不 apply，由并行的 `deploy-sql-17-11-cli-groups` 覆盖；
      # 两个 job 合起来才是该脚本的两种形态。
      - name: 组角色（默认 5 组，按 provision-db.sh:267-273 的顺序）
        run: |
          set -euo pipefail
          for f in \
            auth_privacy.sql \
            catalog_readers.sql \
            consent_granter.sql \
            profile_runtime.sql \
            knowledge_runtime.sql ; do
            echo "== services/api/db/roles/${f}"
            psql -X -q -v ON_ERROR_STOP=1 -f "services/api/db/roles/${f}"
          done
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: gengyun_cvm_owner
          PGPASSWORD: synthetic-ci-owner-only
          PGDATABASE: gengyun
      # ③ 运行时 LOGIN：`20-login-roles.sql` 自己校验库名／owner／口令形状，任一不符即红。
      # 口令是 48 位小写十六进制的合成值（`openssl rand -hex 24` 的形状），⛔ 不是任何真实口令。
      - name: 20-login-roles.sql（运行时 LOGIN + 列级最小权限）
        run: |
          set -euo pipefail
          psql -X -q -v ON_ERROR_STOP=1 -f deploy/postgres-cvm/sql/20-login-roles.sql
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: gengyun_cvm_owner
          PGPASSWORD: synthetic-ci-owner-only
          PGDATABASE: gengyun
          GENGYUN_API_RUNTIME_PASSWORD: 4f3c2b1a0e9d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a3f2e1d
      # ④ 断言：**双保险**（判据④）——psql 退出码 0 **且** 末行正好 `ok`，缺一条即红。
      # 为什么必须自己校验末行：90-assert 用 `SELECT ... AS verdict` 打印结论，断言判 FAIL 时它只是
      #   打印一行 `FAIL: ...` 然后正常结束，**psql 退出码恒为 0**（另一个并行切片正在给它加 hard-fail）。
      #   只信退出码就会把「断言全红」当成绿。
      # 等 hard-fail 那个切片合入后，末行校验可以简化（退出码不再恒 0），但**两道都要保留**：
      #   退出码挡「断言脚本没跑到判决」（被 ON_ERROR_STOP 截断、SQL 报错），
      #   末行挡「跑完了但结论不是 ok」。两者覆盖的失败模式不同，报错信息也不同。
      # 注意：探针段会故意触发若干 `permission denied`（那是被验的读数，写 stderr 是正常的），
      #   所以只对「末行」与「退出码」取值，不按日志里有没有 `ERROR` 判红。
      # ⛔ 本步成功提示里**不要写死断言条数**（旧版把条数写进了成功提示，例如把某个数字钉在
      #   「N 条断言判绿」上）：断言数随切片增长（S28 到 S38 已经涨过一轮），写死的数字必然过期，
      #   还会把「条数对不对」误当成判据。
      #   条数与对错都以 90-assert 自身输出为准（末行 ok ＋ 退出码 0）。
      - name: 90-assert-least-privilege.sql（末行 ok 且退出码 0）
        run: |
          set -euo pipefail
          out="$(mktemp)"
          rc=0
          if psql -X -q -v ON_ERROR_STOP=1 -f deploy/postgres-cvm/sql/90-assert-least-privilege.sql >"${out}" 2>&1; then
            rc=0
          else
            rc=$?
          fi
          echo "---- 90-assert 输出（尾部 20 行；完整输出见上面的 psql 读数）----"
          tail -n 20 "${out}"
          verdict="$(awk 'NF { last = $0 } END { print last }' "${out}")"
          echo "退出码=${rc} 末行='${verdict}'"
          if [ "${rc}" -ne 0 ]; then
            echo "::error::90-assert 的 psql 退出码是 ${rc}（要求 0）：断言脚本内部报错或被 ON_ERROR_STOP 截断。"
            exit 1
          fi
          if [ "${verdict}" != "ok" ]; then
            echo "::error::90-assert 末行不是 ok（实际：'${verdict}'）：断言没跑完／被改松／结论不是 ok。"
            exit 1
          fi
          echo "90-assert：退出码 0 且末行 ok —— 双保险齐了。"
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: gengyun_cvm_owner
          PGPASSWORD: synthetic-ci-owner-only
          PGDATABASE: gengyun
      # ⑥ 授权面探针（R28-S71）：把「运行时到底被授了什么」接进本 job 的判红读数。
      #
      # 为什么需要这一步（实证出处 `docs/verification/gy-r28-probe-in-ci-20261021.md`）：
      #   · `deploy/postgres-cvm/evidence/probe-runtime-grants.sql` 是 S26/S28/S38/S51 四轮授权面
      #     的实测脚本（现状矩阵 → 三域零行探针 → 对照臂 → 表级 DML 清单 → 函数面），但 R28-S71
      #     之前**没有任何 workflow 执行过它**：它只是「文档里的读数」。有人把 20-login-roles.sql
      #     的授段改窄、把迁移里 REVOKE … FROM PUBLIC 删掉，CI 仍然全绿 —— 这正是本步要补的缺口。
      #   · 它与上一步的分工：90-assert 只看「末行 ok」，判据是全有/全无；探针按**语句形状**逐条
      #     回答「这个角色能不能跑这条 SQL」，并且**故意让禁止面报错**（文件 :34 自己把
      #     `ON_ERROR_STOP` 设成 0 是设计的一部分），所以它不能用「退出码 0」单独判。
      #
      # 判据三重（任一不成立即 `::error::` + 非 0 退出；⛔ 无 `continue-on-error`、无 `|| true`、无 `if:`）：
      #   ① 退出码 0：挡「连不上库 / 脚本被截断 / psql 自身报错」。被验的 42501 不改退出码。
      #   ② 关键标记逐条命中（下面的 `markers` 数组，逐个 `grep -F`），三类：
      #      · 遍历标记：脚本期真的跑到了那一段（`### 0)`、`-- [5]…[8] 探针结束`、`### 探针结束`）；
      #      · 授权面读数：`admin_accounts_rows`（段 8a-1 的列头 —— EXECUTE 被拒权时 psql
      #        只打 ERROR 不打列头，授段一改这条就没了）；`public.idempotency_keys`（段 4 /
      #        对照臂里 90-assert 唯一豁免的那张表，仍必须出现在运行时的表级 DML 面里）；
      #      · 禁止面读数：3 张表的 DELETE ＋ selections 的 FOR UPDATE ＋ 2 张表的 DELETE
      #        ＋ 3 个 internal 函数 ＋ 2 个 trigger 函数，各一条 `permission denied …`。
      #        注意 8b 的三条**现在**是 `permission denied for schema …`：运行时连
      #        catalog_ops / staging_intake 的 USAGE 都没有，拒权发生在取名阶段、比函数级
      #        EXECUTE 更早。这是真实读数（本步只钉住它，不替它选口径）；哪天有人补了
      #        schema USAGE 而仍拒 EXECUTE，报错文本会变成 `permission denied for function …`，
      #        本步会因此判红——那正是一次「授权面被改动，请复核」的信号。
      #   ③ 错误行条数**恰好**等于禁止面条数（`expected_42501`）：既挡「少报」（禁止面被授了
      #      权限、或整段没跑到），也挡「多报」（正向语句被误拒权，或冒出 0A000 之类的别的错误类）。
      #      ⚠ 这不是「写在成功提示里的死数字」：`tests/unit/deploy-sql-gate-probe.test.mjs` 每次都
      #      从 `probe-runtime-grants.sql` 源码按四处禁止面**重新数一遍**并与本常量比对 ——
      #      探针加了禁止面语句而这里没跟，静态守卫先红。
      - name: 授权面探针 probe-runtime-grants.sql（退出码 0 + 标记 + 错误条数）
        run: |
          set -euo pipefail

          probe="deploy/postgres-cvm/evidence/probe-runtime-grants.sql"
          out="$(mktemp)"
          errs="$(mktemp)"

          rc=0
          if psql -X -q -v ON_ERROR_STOP=0 -f "${probe}" >"${out}" 2>&1; then
            rc=0
          else
            rc=$?
          fi
          echo "---- 探针输出（尾部 40 行；完整输出见上面的 psql 读数）----"
          tail -n 40 "${out}"
          echo "退出码=${rc}"

          failed=0
          if [ "${rc}" -ne 0 ]; then
            echo "::error::探针的 psql 退出码是 ${rc}（要求 0）：连不上库、脚本被截断，或 psql 自身报错。被验的 42501 不会改退出码（文件自己把 ON_ERROR_STOP 设成 0 是设计的一部分）。"
            failed=1
          fi

          # ---- ② 关键标记：缺一条就红 ----
          markers=(
            '### 0) 环境'
            '### 探针结束'
            '-- [5] 收藏／历史／对话域探针结束'
            '-- [6] 识别域探针结束'
            '-- [7] 语音域探针结束'
            '-- [8] 函数面探针结束'
            'public.idempotency_keys'
            'admin_accounts_rows'
            'permission denied for table recognition_jobs'
            'permission denied for table recognition_records'
            'permission denied for table recognition_selections'
            'permission denied for table speech_jobs'
            'permission denied for table transcriptions'
            'permission denied for schema catalog_ops'
            'permission denied for schema staging_intake'
            'permission denied for function consent_policy_immutable'
            'permission denied for function admin_audit_events_reject_mutation'
          )

          missing=0
          for marker in "${markers[@]}"; do
            if grep -F -q -- "${marker}" "${out}"; then
              echo "标记命中：${marker}"
            else
              echo "::error::探针输出里缺少标记：${marker}（清单见本步 markers，口径见 docs/verification/gy-r28-probe-in-ci-20261021.md 的 §2）"
              missing=$((missing + 1))
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "::error::共缺 ${missing} 条标记（清单见上）：授权面或探针遍历断了，本步读数不可信。"
            failed=1
          fi

          # ---- ③ 错误条数：只允许禁止面那 expected_42501 条，且一条不少 ----
          # 算式（探针源码逐条相加，见证据页 §2）：段 6 禁止面 4 ＋ 段 7 禁止面 2
          #   ＋ 段 8b internal 函数 3 ＋ 段 8c trigger 函数 2 = 11。
          # 行形状：psql 读文件且 VERBOSITY=verbose 时是
          #   `psql:<file>:<line>: ERROR:  42501: permission denied for …`
          # ⇒ 不能锚 `^ERROR:`（那会恒为 0 条，等于把判据废掉）；这里锚 `ERROR:  <SQLSTATE>:`。
          expected_42501=11
          total_errors=0
          if grep -qE 'ERROR:[[:space:]]+[0-9A-Z]{5}:' "${out}"; then
            total_errors="$(grep -cE 'ERROR:[[:space:]]+[0-9A-Z]{5}:' "${out}")"
          fi
          forbidden_errors=0
          if grep -qE 'ERROR:[[:space:]]+42501:' "${out}"; then
            forbidden_errors="$(grep -cE 'ERROR:[[:space:]]+42501:' "${out}")"
          fi
          echo "ERROR 行=${total_errors}（其中 42501=${forbidden_errors}），期望=${expected_42501}"
          if [ "${total_errors}" -ne "${expected_42501}" ]; then
            echo "::error::探针输出的 ERROR 行数是 ${total_errors}（要求恰好 ${expected_42501}）：少报说明禁止面被授了权限（或整段没跑到），多报说明正向语句被误拒权、或出现了别的错误类。全部 ERROR 行如下："
            grep -E 'ERROR:[[:space:]]+[0-9A-Z]{5}:' "${out}" >"${errs}" || dump_rc=$?
            while IFS= read -r line; do
              echo "  ${line}"
            done <"${errs}"
            failed=1
          fi
          if [ "${forbidden_errors}" -ne "${expected_42501}" ]; then
            echo "::error::其中 42501（permission denied）是 ${forbidden_errors} 条（要求恰好 ${expected_42501}）：说明有错误不是「禁止面被拒」，禁止面/正向面的授权口径变了。"
            failed=1
          fi

          if [ "${failed}" -ne 0 ]; then
            echo "---- 完整探针输出（只在判红时打，便于定位）----"
            cat "${out}"
            echo "::error::授权面探针判红：逐条见上。⛔ 不许给这步加条件执行或兜底写法来消红（注解不改变结论）。"
            exit 1
          fi

          echo "探针通过：退出码 0；标记 ${#markers[@]} 条全中；ERROR 行 ${total_errors} 条且全部是禁止面 42501（期望 ${expected_42501}）。"
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: gengyun_cvm_owner
          PGPASSWORD: synthetic-ci-owner-only
          PGDATABASE: gengyun
      # ⑤ 误授恢复演练（R28-S42）：证明「重跑 20-login-roles.sql 能把被误撤的列级授权恢复回来」。
      #
      # 为什么需要这一步（实证出处见 `docs/verification/gy-r28-deploy-sql-recovery-replay-20261021.md`）：
      #   · PG 的列级 ACL 落在 `pg_attribute.attacl`，而表级 `REVOKE <priv> ON <table>` 会**连带
      #     撤销同类型的列级授权**（S38 证据页写死过这条本仓踩过的坑）。所以「误授之后复原」不能
      #     只补一条表级/列级 GRANT，唯一正解是**重跑 `20-login-roles.sql`**（它每次部署都会执行，
      #     逐列 GRANT 就在该文件的 I 段）。
      #   · 但本 workflow 此前**只跑一次** 20-login-roles.sql（第 ③ 步），这条救命恢复路径从没被
      #     证明过：一旦有人把 I 段改成「角色不存在才 GRANT」、或把 GRANT 加上条件，CI 仍全绿。
      #   本步把恢复路径变成可判红的读数，五段顺序固定（改顺序会让「恢复」与「制造误授」互相抵消）：
      #     ① 前置自检：`public.favorites.id` 的列级 SELECT 必须已是 `t`；不是就直接红 ——
      #        这说明前置授权本身变了，演练前提不成立，⛔ 不许换成别的列硬凑。
      #     ② 幂等重跑：连跑 2 次 20-login-roles.sql，两次都必须 exit 0（脚本可重复执行）。
      #     ③ 制造误授：`REVOKE SELECT (id) ON TABLE public.favorites`，随后读数必须变 `f`；
      #        不变 f 就红 —— 否则「恢复」这一步是假的（撤都没撤掉，谈何恢复）。
      #     ④ 恢复：再跑一次 20-login-roles.sql（exit 0），读数必须回到 `t`。
      #     ⑤ 复验断言：重跑 90-assert，**双保险**照第 ④ 步（退出码 0 **且** 末行正好 `ok`）。
      #
      # 判据口径与第 ④ 步逐字一致：只认退出码与末行，⛔ 不按日志里有没有 `ERROR` 判红
      #   （90-assert 的探针段会故意打出 42501，那是被验的读数）。⛔ 无 `continue-on-error`、
      #   无 `|| true`、无 `if:` —— 任一构造都会让本演练退化成装饰品。
      - name: 恢复演练：撤销一列授权 → 重跑 20-login-roles.sql → 90-assert 仍 ok
        run: |
          set -euo pipefail

          # 读 `public.favorites.id` 的列级 SELECT 真值（`-tA` ⇒ 只打印 t / f）。
          col_priv() {
            psql -X -q -tA -v ON_ERROR_STOP=1 \
              -c "SELECT has_column_privilege('gengyun_api_runtime', 'public.favorites', 'id', 'SELECT')"
          }

          # ① 前置自检：演练的前提是「该列已授」。为 f 说明 20-login-roles.sql 的 I 段授权变了，
          #    此时继续演练只会得出「撤销一个本来就没有的权限」的假读数。
          before="$(col_priv)"
          echo "前置：has_column_privilege(gengyun_api_runtime, public.favorites, id, SELECT)=${before}"
          if [ "${before}" != "t" ]; then
            echo "::error::恢复演练前置不成立：public.favorites.id 的列级 SELECT 当前是 '${before}'（要求 t）。这说明前置授权本身变了（20-login-roles.sql 的 I 段），演练前提不存在；⛔ 不要换成别的列硬凑。"
            exit 1
          fi

          # ② 幂等重跑两次：两次都必须 exit 0。这一半证明「脚本可重复执行」——
          #    若它变成「角色不存在才建/才授」，第二次会静默少做事，这里就会与第 ④ 段一起露馅。
          for attempt in 1 2; do
            rc=0
            psql -X -q -v ON_ERROR_STOP=1 -f deploy/postgres-cvm/sql/20-login-roles.sql || rc=$?
            echo "20-login-roles.sql 第 ${attempt} 次重跑：exit=${rc}"
            if [ "${rc}" -ne 0 ]; then
              echo "::error::20-login-roles.sql 第 ${attempt} 次重跑 exit=${rc}（要求 0）：脚本已不可重复执行（幂等被破坏）。"
              exit 1
            fi
          done

          # ③ 制造误授：只撤这一列的 SELECT。撤不掉（读数不是 f）就红 —— 否则恢复演练是假的。
          rc=0
          psql -X -q -v ON_ERROR_STOP=1 \
            -c "REVOKE SELECT (id) ON TABLE public.favorites FROM gengyun_api_runtime" || rc=$?
          echo "撤销 public.favorites.id 的列级 SELECT：exit=${rc}"
          if [ "${rc}" -ne 0 ]; then
            echo "::error::REVOKE public.favorites.id 失败（exit=${rc}）：无法制造误授态，恢复演练无效。"
            exit 1
          fi
          revoked="$(col_priv)"
          echo "撤销后：has_column_privilege=${revoked}"
          if [ "${revoked}" != "f" ]; then
            echo "::error::撤销后 has_column_privilege 仍是 '${revoked}'（要求 f）：撤销没有生效，恢复演练是假的。"
            exit 1
          fi

          # ④ 恢复：重跑 20-login-roles.sql 必须把该列授权带回来（这是本步要证明的那条路径）。
          rc=0
          psql -X -q -v ON_ERROR_STOP=1 -f deploy/postgres-cvm/sql/20-login-roles.sql || rc=$?
          echo "重跑 20-login-roles.sql 恢复授权：exit=${rc}"
          if [ "${rc}" -ne 0 ]; then
            echo "::error::恢复用的 20-login-roles.sql exit=${rc}（要求 0）：恢复路径本身执行失败。"
            exit 1
          fi
          recovered="$(col_priv)"
          echo "恢复后：has_column_privilege=${recovered}"
          if [ "${recovered}" != "t" ]; then
            echo "::error::重跑 20-login-roles.sql 后 has_column_privilege 是 '${recovered}'（要求 t）：**恢复路径失效**，误撤的列级授权补不回来。"
            exit 1
          fi

          # ⑤ 复验断言：双保险照第 ④ 步 —— 退出码 0 **且** 末行正好 ok，缺一条即红。
          out="$(mktemp)"
          rc=0
          if psql -X -q -v ON_ERROR_STOP=1 -f deploy/postgres-cvm/sql/90-assert-least-privilege.sql >"${out}" 2>&1; then
            rc=0
          else
            rc=$?
          fi
          echo "---- 恢复演练后的 90-assert 输出（尾部 20 行；完整输出见上面的 psql 读数）----"
          tail -n 20 "${out}"
          verdict="$(awk 'NF { last = $0 } END { print last }' "${out}")"
          echo "退出码=${rc} 末行='${verdict}'"
          if [ "${rc}" -ne 0 ]; then
            echo "::error::恢复后的 90-assert 的 psql 退出码是 ${rc}（要求 0）：恢复后断言脚本内部报错或被 ON_ERROR_STOP 截断。"
            exit 1
          fi
          if [ "${verdict}" != "ok" ]; then
            echo "::error::恢复后的 90-assert 末行不是 ok（实际：'${verdict}'）：重跑 20-login-roles.sql 未能把最小权限恢复到合规态。"
            exit 1
          fi
          echo "恢复演练通过：撤销后 has_column_privilege=f → 重跑 20-login-roles.sql → t；90-assert 末行 ok 且退出码 0"
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: gengyun_cvm_owner
          PGPASSWORD: synthetic-ci-owner-only
          PGDATABASE: gengyun
          # 重跑 20-login-roles.sql 需要它（\getenv 校验 48 位小写十六进制；与第 ③ 步同一合成值）。
          GENGYUN_API_RUNTIME_PASSWORD: 4f3c2b1a0e9d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a3f2e1d

  # -------------------------------------------------------------------------------------------------
  # 第二个 job：`provision-db.sh --with-cli-groups` 的 **7 组形态**（R28-S64）。
  #
  # 为什么单独开一个 job，而不是在上面的 job 里多 apply 两份：
  #   · 形态不同就是读数不同。默认 5 组是生产默认形态，7 组是开 `--with-cli-groups` 装机时的形态；
  #     挤在同一个库里会同时得到「5 组也过」「7 组也过」两组结论，但分不清是哪组数据在说话。
  #   · 两个 job 各自 `runs-on` 独立 runner、各自一个 `services.postgres`，互不共享库，平行跑、互不依赖。
  #
  # 这个形态此前**没有任何 workflow 跑过**（默认 job 只 apply 5 组），所以下面这几件事只有本 job 能证明：
  #   · `source_operator.sql` / `staging_importer.sql` 能在干净库上落地（它们建
  #     `gengyun_source_operator` / `gengyun_source_executor` / `gengyun_staging_importer` /
  #     `gengyun_staging_executor` 四个角色）；
  #   · 这两份把 `catalog_ops.apply_source_operation(...)`、`staging_intake.apply_import(...)` /
  #     `rollback_import(...)` 的属主改成 executor、EXECUTE 只授 CLI 组之后，
  #     `20-login-roles.sql` 与 `90-assert-least-privilege.sql` 仍然判绿（不改运行时那 5 组的读数）；
  #   · 迁移全链 ＋ 7 份角色文件 ＋ 两条脚本的组合被真正执行过一次。
  #
  # ⛔ 与上面的 job 同一口径：不设跳过开关、不传跳过参数、无 `continue-on-error`、无 `|| true`、无 `if:`；
  #   断言步骤同样「psql 退出码 0 **且** 末行正好 ok」双保险。缺库／缺角色／断言红都必须以**非 0** 结束。
  deploy-sql-17-11-cli-groups:
    name: deploy-sql-17.11-cli-groups
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        # 库名与 owner 必须与第一个 job／生产同形：`20-login-roles.sql:94` 断言 `current_database() = 'gengyun'`。
        image: postgres:17.11
        env:
          POSTGRES_DB: gengyun
          POSTGRES_USER: gengyun_cvm_owner
          POSTGRES_PASSWORD: synthetic-ci-owner-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      # ① 全链迁移：与第一个 job 逐字同一条命令、同一个 DATABASE_URL 形状。
      - name: 迁移全链（0001..当前末位，以 migrations 目录实际最大号为准）
        run: node services/api/src/db/migrate.ts up
        env:
          DATABASE_URL: postgres://gengyun_cvm_owner:synthetic-ci-owner-only@127.0.0.1:5432/gengyun
      # ② 组角色：默认 5 组**同序** ＋ `--with-cli-groups` 才追加的 2 份，共 7 份。
      #    仍显式列文件名（不写 glob），理由同第一个 job：glob 序与 `provision-db.sh` 的 apply 序不一致。
      - name: 组角色（7 组：默认 5 组 + --with-cli-groups 的 2 组）
        run: |
          set -euo pipefail
          for f in \
            auth_privacy.sql \
            catalog_readers.sql \
            consent_granter.sql \
            profile_runtime.sql \
            knowledge_runtime.sql \
            source_operator.sql \
            staging_importer.sql ; do
            echo "== services/api/db/roles/${f}"
            psql -X -q -v ON_ERROR_STOP=1 -f "services/api/db/roles/${f}"
          done
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: gengyun_cvm_owner
          PGPASSWORD: synthetic-ci-owner-only
          PGDATABASE: gengyun
      # ③ 运行时 LOGIN：同一条脚本、同一个 48 位 hex 合成口令（⛔ 不是任何真实口令）。
      - name: 20-login-roles.sql（运行时 LOGIN + 列级最小权限）
        run: |
          set -euo pipefail
          psql -X -q -v ON_ERROR_STOP=1 -f deploy/postgres-cvm/sql/20-login-roles.sql
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: gengyun_cvm_owner
          PGPASSWORD: synthetic-ci-owner-only
          PGDATABASE: gengyun
          GENGYUN_API_RUNTIME_PASSWORD: 4f3c2b1a0e9d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a3f2e1d
      # ④ 断言：**双保险**，与第一个 job 逐字同一套 shell（判据④）——退出码 0 **且** 末行正好 `ok`。
      #    只认这两个量，⛔ 不按日志里有没有 `ERROR` 判红：90-assert 的探针段会故意打出 42501，
      #    那是被验的读数，属预期。
      #    ⛔ 成功提示里**不要写死断言条数**（条数随切片增长，写死必然过期）。
      - name: 90-assert-least-privilege.sql（末行 ok 且退出码 0）
        run: |
          set -euo pipefail
          out="$(mktemp)"
          rc=0
          if psql -X -q -v ON_ERROR_STOP=1 -f deploy/postgres-cvm/sql/90-assert-least-privilege.sql >"${out}" 2>&1; then
            rc=0
          else
            rc=$?
          fi
          echo "---- 90-assert 输出（尾部 20 行；完整输出见上面的 psql 读数）----"
          tail -n 20 "${out}"
          verdict="$(awk 'NF { last = $0 } END { print last }' "${out}")"
          echo "退出码=${rc} 末行='${verdict}'"
          if [ "${rc}" -ne 0 ]; then
            echo "::error::90-assert 的 psql 退出码是 ${rc}（要求 0）：断言脚本内部报错或被 ON_ERROR_STOP 截断。"
            exit 1
          fi
          if [ "${verdict}" != "ok" ]; then
            echo "::error::90-assert 末行不是 ok（实际：'${verdict}'）：断言没跑完／被改松／结论不是 ok。"
            exit 1
          fi
          echo "90-assert：退出码 0 且末行 ok —— 双保险齐了。"
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: gengyun_cvm_owner
          PGPASSWORD: synthetic-ci-owner-only
          PGDATABASE: gengyun
