name: Engineering shell gates

# 分层 CI：文档检查 / 静态检查 / 确定性单元 / 集成回环（无 PG／无工具／无外网）/ 契约测试 / 评估回归 / 后台与 API 构建。
# 每层是独立 job，检查名固定，便于后续 PR 作为必需检查引用。
# 评估回归（GY-I20）只用 Node 标准库、任何真实外部调用一律禁用（合成/程序验证夹具）。
# 微信开发者工具编译与真机是**本机任务**，不在本 CI，也不由 Node 检查冒充。

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 --version
      - run: python3 tools/validate_development_docs.py
      - run: python3 tools/validate_contracts.py
      - run: python3 tools/test_contracts.py

  static:
    name: static-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint

  unit:
    name: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:unit
      # `test:unit` 只跑 `tests/{unit,privacy,media,reference,moderation}/*.test.mjs` 这批 glob，
      # **不含**顶层 `tests/ui-unified-states.test.mjs`：它是契约错误码 ↔ `miniprogram/utils/states.js`
      # 的双向对拍（契约里每个码都必须有状态归类；多出未登记的码同样红）。不单独跑这一步，
      # 「契约加了码、端上没归类」这类漏改会一路合进 main，出错时页面没有状态可渲染。
      - name: "统一状态层 ↔ 契约错误码双向对拍（顶层用例，不在 test:unit 的 glob 里）"
        run: node --test tests/ui-unified-states.test.mjs
      # 同上，另一条顶层用例：`tests/demo-ui-components.test.mjs` 也不在 `test:unit` 的 glob 里，
      # 而它在全部 15 份 workflow 里原本 **0 命中**——按钮／标签的禁用-加载态守卫、搜索的受控
      # input／confirm／clear、样张宿主回写这 3 条断言，坏掉也不会有任何 CI 变红。
      # 这句话的接线由 `tests/unit/ci-orphan-tests-wired.test.mjs` 静态守住：这步 `run:` 一旦被删，
      # 它就会把本文件当孤儿点名（改走别的门禁也行，但必须**真被常跑**，不能只写在注释里）。
      - name: "UI 基础组件行为守卫（顶层用例，不在 test:unit 的 glob 里）"
        run: node --test tests/demo-ui-components.test.mjs

  integration:
    name: integration-http
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      # `tests/integration/**` 里**逐个列出**的回环脚本（无 PG／无微信开发者工具／无外网）。
      # 名单写在 `package.json` 的 `test:integration:http` 里，**不得**改成 glob：
      # `tests/integration/**` 还有需 PG（`*-pg.mjs`）与需微信工具（`local-dev-*.cjs`）的脚本，
      # 一把抓会把它们拖进必跑路径 ⇒ 必然红。
      - run: npm run test:integration:http

  contract:
    name: contract-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:contract
      - run: node tools/verify-contract-status.mjs
      - run: node tools/verify-doc-anchors.mjs --strict --symbol=strict --scan docs
      - run: npm run verify:capability-map

  evaluation:
    name: evaluation-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:evaluation

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  # 数据保留／到期清除的**调度层**门禁（GY-R32 · #19 的 `tools/verify-purge-schedule.mjs`）。
  # 缺口（接线前实测）：`package.json` 有 `verify:purge-schedule`，但 15 份 workflow 里
  # `verify:purge-schedule` **0 命中** ⇒ 该门禁只能靠人记得在本地跑；删掉
  # `deploy/purge-schedule/*.timer`（到期清除就没有时钟了）或往 API 进程里塞一个 `setInterval(`
  # （多副本重复执行 + 与真库臂抢同一批行），全仓测试照样全绿。
  # ⇒ 本 job 让它在每次 PR / 每次 push main 都跑，检查名固定为 `retention-gates`。
  # 只接**纯静态**判据：脚本自陈「不连库、不起服务、不读凭据、不写任何文件、不联网、无第三方依赖」，
  # 扫的就是 `deploy/purge-schedule/**` 与 `services/api/src/**` 的文本（10 项判据：surface / pair /
  # calendar / execstart / cursor / secrets / setinterval / npm-script / hygiene / coverage）。
  # 不接 `tests/integration/*-purge-pg.mjs` 那一批：它们要真的 PG 17 集群与 `GY_PG_BIN`
  # （缺了按约定 exit 77 跳过），属于 `real-pg-integration.yml` 的真库臂；拖进这里等于让
  # 「无需 PG」的这一层在没有库的 runner 上必然红。
  # 不设 `needs:`：本 job 只读树内文本，与其它 job 不共享产物、不需要构建 ⇒ 无数据依赖；
  # 加 `needs` 只会把本可并行的 PR 检查改成串行。
  retention-gates:
    name: retention-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run verify:purge-schedule
