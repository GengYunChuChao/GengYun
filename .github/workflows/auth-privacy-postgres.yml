name: Auth and consent native PostgreSQL gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  auth-privacy-pg:
    name: auth-privacy-postgres-17.11
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: gengyun_auth_privacy_test
          POSTGRES_USER: gengyun_ci_owner
          POSTGRES_PASSWORD: synthetic-ci-owner-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node tests/integration/auth-privacy-pg.mjs
        env:
          AUTH_PRIVACY_TEST_URL: postgres://gengyun_ci_owner:synthetic-ci-owner-only@127.0.0.1:5432/gengyun_auth_privacy_test
      # GY-I02 迁移负例：半截失败必须回滚干净 / 重放不得部分再执行 / 0016 up→down 可逆。
      # 维护连接指向服务自带的空 `postgres` 库：脚本只拿它当建/删数据库的入口，自己建
      # `gengyun_migrations_negative_maint` 作维护库、`…_{a,b,c}` 作被测库，收尾全部删掉并断言
      # `pg_database` 无残留。⛔ 不要改回 `gengyun_auth_privacy_test`：两个 step 用同一个库时，
      # 一端崩溃留下的角色/对象会掩住另一端（隔离判据见 tests/unit/auth-privacy-arm-isolation.test.mjs）。
      - run: node tests/integration/migrations-negative-pg.mjs
        env:
          MIGRATIONS_NEGATIVE_TEST_URL: postgres://gengyun_ci_owner:synthetic-ci-owner-only@127.0.0.1:5432/postgres
