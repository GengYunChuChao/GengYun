name: Development documentation
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'AGENTS.md'
      - 'README.md'
      - '.github/**'
      - 'tools/validate_development_docs.py'
      - 'tools/validate_contracts.py'
      - 'tools/test_contracts.py'
      - 'tools/validate_openapi_standard.py'
      - 'tools/verify-research-records.mjs'
      - 'packages/contracts/**'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'AGENTS.md'
      - 'README.md'
      - '.github/**'
      - 'tools/validate_development_docs.py'
      - 'tools/validate_contracts.py'
      - 'tools/test_contracts.py'
      - 'tools/validate_openapi_standard.py'
      - 'tools/verify-research-records.mjs'
      - 'packages/contracts/**'
permissions:
  contents: read
jobs:
  development-docs:
    name: development-docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 --version
      - run: python3 tools/validate_development_docs.py
      - run: python3 tools/validate_contracts.py
      - run: python3 tools/test_contracts.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.16.0'
      - run: node tools/verify-research-records.mjs
