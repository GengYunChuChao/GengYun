name: Workbook staging PostgreSQL 17
on:
  pull_request:
    paths:
      - 'tools/knowledge/import_workbook_staging.py'
      - 'tests/knowledge/**'
      - 'tests/integration/workbook-staging-pg.mjs'
      - 'services/api/db/migrations/**'
      - '.github/workflows/workbook-staging.yml'
      # 被测实现目录（R68-D04）：本臂跑的是 `services/api/src/knowledge/**` 的服务端逻辑，
      # 只改实现不触发这条臂等于「真库读数静默下降」。结构守卫判据⑩ 会从数据里复算这一条。
      - 'services/api/src/knowledge/**'
  push:
    branches: [main]
    paths:
      - 'tools/knowledge/import_workbook_staging.py'
      - 'services/api/db/migrations/**'
      - 'services/api/src/knowledge/**'
permissions:
  contents: read
jobs:
  staging-pg17:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: staging_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: gengyun_staging_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: python3 tests/knowledge/test_workbook_staging.py
      - run: node tests/integration/workbook-staging-pg.mjs
        env:
          STAGING_PG_TEST_URL: postgresql://staging_test:synthetic-ci-only@127.0.0.1:5432/gengyun_staging_test
