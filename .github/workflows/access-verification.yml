name: Access verification guards
on:
  pull_request:
    paths: ['docs/verification/**', 'tools/verify-env.mjs', 'tools/ai-config.mjs', 'tools/prepare-ai-verification.mjs', 'tools/check-ai-sdk.cjs', 'tools/verify-tokenhub.mjs', 'tests/tokenhub-account.test.mjs', 'tests/ai-config.test.mjs', 'tools/verify-wechat-account.cjs', 'tools/verify-deepseek.cjs', 'tools/verify-tencent-identity.cjs', 'tests/tencent-identity.test.cjs', 'tests/deepseek-account.test.cjs', 'tests/verify-env.test.mjs', 'tests/wechat-account.test.cjs', '.gitignore', '.github/workflows/access-verification.yml']
  push:
    branches: [main]
    paths: ['docs/verification/**', 'tools/verify-env.mjs', 'tools/ai-config.mjs', 'tools/prepare-ai-verification.mjs', 'tools/check-ai-sdk.cjs', 'tools/verify-tokenhub.mjs', 'tests/tokenhub-account.test.mjs', 'tests/ai-config.test.mjs', 'tools/verify-wechat-account.cjs', 'tools/verify-deepseek.cjs', 'tools/verify-tencent-identity.cjs', 'tests/tencent-identity.test.cjs', 'tests/deepseek-account.test.cjs', 'tests/verify-env.test.mjs', 'tests/wechat-account.test.cjs', '.gitignore', '.github/workflows/access-verification.yml']
permissions:
  contents: read
jobs:
  access-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.16.0'
      - run: node --check tools/check-ai-sdk.cjs
      - run: node --check tools/verify-tokenhub.mjs
      - run: node --test tests/tokenhub-account.test.mjs
      - run: node --check tools/ai-config.mjs
      - run: node --check tools/prepare-ai-verification.mjs
      - run: node --test tests/ai-config.test.mjs
      - name: Install pinned Tencent SDKs without lifecycle scripts
        run: npm install --prefix "$RUNNER_TEMP/gy25-sdk" tencentcloud-sdk-nodejs-ocr@4.1.322 tencentcloud-sdk-nodejs-asr@4.1.315 tencentcloud-sdk-nodejs-tts@4.1.237 tencentcloud-sdk-nodejs-tms@4.1.311 tencentcloud-sdk-nodejs-ims@4.1.321 --ignore-scripts --no-audit --no-fund
      - name: Check SDK exports and constructors with network blocked
        run: node tools/check-ai-sdk.cjs --modules "$RUNNER_TEMP/gy25-sdk/node_modules"
      - run: node --check tools/verify-env.mjs
      - run: node --test tests/verify-env.test.mjs
      - run: node --check tools/verify-wechat-account.cjs
      - run: node --test tests/wechat-account.test.cjs
      - run: node --check tools/verify-deepseek.cjs
      - run: node --test tests/deepseek-account.test.cjs
      - run: node --check tools/verify-tencent-identity.cjs
      - run: node --test tests/tencent-identity.test.cjs
      - run: git check-ignore docs/verification/config.local.json
      - run: if git check-ignore docs/verification/config.example.json; then exit 1; fi
