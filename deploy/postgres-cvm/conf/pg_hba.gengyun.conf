# ============================================================================
# 耕云 CVM PostgreSQL 17 客户端认证配置（由 install-postgres.sh 安装到
# ${PGDATA}/pg_hba.conf，替换 initdb 生成的默认文件）
#
# 状态：技术准备物，未部署、未验收、未在任何真实 PG 实例上执行过。
#
# 规则自上而下，首条匹配即生效。本文件刻意不包含任何 0.0.0.0/0 或 ::/0 规则：
# 公网 5432 由**入站规则**关闭（标准 CVM = 安全组；轻量应用服务器 Lighthouse = 实例防火墙——
# 官方说明其“安全防护作用等同于云服务器中的安全组”，且**只控入流量**）。
# pg_hba 保证即使入站规则被误放开，公网来源也无任何可匹配的认证行（默认拒绝）。
#
# 三者一致性（README.md 第 2 节）：
#   listen_addresses = 127.0.0.1 + 目标网段私网 IP（conf/10-gengyun-postgres.conf）
#   pg_hba          = 仅回环 + 目标网段 10.21.0.0/16（本文件；方案 A 的 VPC）
#   入站规则        = 仅目标网段可访问 5432（标准 CVM 用安全组；Lighthouse 用实例防火墙）
#                     ——由用户在控制台核对，脚本无云凭据
# ============================================================================

# TYPE      DATABASE    USER                    ADDRESS             METHOD

# --- 本机运维：Unix socket + pg_ident 映射，无口令 ---------------------------
# 仅系统用户 postgres 可映射为 gengyun_cvm_owner（见 pg_ident.gengyun.conf）。
# 其它 (系统用户, 数据库用户) 组合映射失败，一律拒绝，包括 root。
local       all         all                                         peer map=gengyun_ops

# --- 本机回环 TCP：口令认证（诊断与 API 走回环时使用）-----------------------
host        all         all                     127.0.0.1/32        scram-sha-256
host        all         all                     ::1/128             scram-sha-256

# --- 目标网段内网：仅业务库 + 两个专用身份 --------------------------------------
# 迁移管理员：一次性建库/迁移/角色引导，日常不由 API 使用。
host        @DB_NAME@   gengyun_cvm_owner       10.21.0.0/16        scram-sha-256
# 应用运行时：最小权限 LOGIN，只继承既有 NOLOGIN 组。
host        @DB_NAME@   gengyun_api_runtime     10.21.0.0/16        scram-sha-256

# --- 显式兜底：目标网段内其它库/身份不可连 --------------------------------------
# 上面两条已把业务库限定到两个身份；其余组合落到此处拒绝。
host        all         all                     10.21.0.0/16        reject
