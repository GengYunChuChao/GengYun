# ============================================================================
# 耕云 CVM PostgreSQL 17 配置片段（由 deploy/postgres-cvm/install-postgres.sh 安装）
#
# 状态：技术准备物，未部署、未验收、未在任何真实 PG 实例上执行过。
#
# 安装目标：${PGDATA}/conf.d/10-gengyun.conf
# 生效方式：postgresql.conf 末尾追加 include_dir = 'conf.d'（本文件被自动读取）
#
# 占位符由 install-postgres.sh 用 sed 替换，替换后本文件即最终配置：
#   @PGDATA@            数据目录（持久云硬盘挂载点下）
#   @PGPORT@            监听端口，默认 5432
#   @VPC_PRIVATE_IP@    CVM 在目标 VPC(10.21.0.0/16；方案 A：子账号 S 内新建) 内的私网 IPv4
#   @CVM_HOSTNAME@      CVM 主机名，仅用于日志定位
#   @DB_NAME@           业务库名（默认 gengyun）
#
# 网络姿态（与**入站规则**、pg_hba 三者必须一致，见 README.md 第 2 节）：
#   listen_addresses 只含回环与目标网段的私网 IPv4，绝不含 '*' 或 '0.0.0.0'。
#   公网 5432 的关闭由入站规则负责（标准 CVM = 安全组；轻量应用服务器 = 实例防火墙），
#   本文件只能保证进程不监听公网地址。
# ============================================================================

# --- 监听与端口 -------------------------------------------------------------
# 回环供本机 API / 迁移 / 备份使用；私网 IP 供同 VPC 内的合法消费者使用。
listen_addresses = '127.0.0.1,@VPC_PRIVATE_IP@'
port = @PGPORT@

# --- 数据目录与持久性 -------------------------------------------------------
# 必须指向独立云硬盘/数据盘的挂载点，重启后数据仍在（判定见 README.md 第 3 节）。
data_directory = '@PGDATA@'
hba_file = '@PGDATA@/pg_hba.conf'
ident_file = '@PGDATA@/pg_ident.conf'

# --- Unix socket ------------------------------------------------------------
# 显式指定，避免依赖编译默认值；与 systemd 单元的 RuntimeDirectory=postgresql
# 以及 pg_hba 的 local 行一致。本机运维（迁移/角色引导/备份）走此 socket + pg_ident。
unix_socket_directories = '/var/run/postgresql'
unix_socket_permissions = 0770

# --- 认证与连接限制 ---------------------------------------------------------
# 口令认证只用 scram-sha-256；PG17 已不再生成 md5 口令。
password_encryption = 'scram-sha-256'
# 明确关闭 ssl：本阶段 CVM 未签发自签/CA 证书，且 pg_hba 用 host（非 hostssl）。
# 残留风险：VPC 内明文传输，靠 VPC ACL + scram 缓解；TLS 是待决项，见 README 第 6 节。
ssl = off
# 非本地消费者一律经 TCP，故不允许无口令的本机 socket 登录到任意数据库。
# （本机运维走 pg_ident 映射，见 pg_ident.gengyun.conf）
max_connections = 100
# 禁止 TCP 保活之外的探测；仅作限额，不代替安全组。
superuser_reserved_connections = 3

# --- 日志（禁止记录语句正文，避免 CREATE/ALTER ROLE 的口令进入日志）--------
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%a.log'
log_rotation_age = 1d
log_rotation_size = 0
log_truncate_on_rotation = on
log_line_prefix = '%m [%p] %q%u@%d %h '
log_timezone = 'UTC'
log_statement = 'none'
log_min_duration_statement = 1000
log_connections = on
log_disconnections = on
log_checkpoints = on

# --- 稳定性 / 与 CI 保持同一主版本 ------------------------------------------
timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'
default_text_search_config = 'pg_catalog.english'
# 数据页校验和（initdb --data-checksums）之外，这里显式设定 wal_level=replica，
# 为后续物理备份/PITR 留出可能；当前交付只实现逻辑备份（pg_dump），见 backup-postgres.sh。
wal_level = replica
archive_mode = off
