# ============================================================================
# 耕云 CVM PostgreSQL 17 系统用户名映射（由 install-postgres.sh 安装到
# ${PGDATA}/pg_ident.conf）
#
# 状态：技术准备物，未部署、未验收、未在任何真实 PG 实例上执行过。
#
# 用途：只把「系统用户 postgres」映射为「数据库用户 gengyun_cvm_owner」，
# 供本机运维（迁移、角色引导、备份）走 Unix socket 免口令完成，
# 从而避免把迁移管理员口令写进脚本、argv 或 CI 日志。
#
# 这是唯一一条映射：root、其它系统用户、以及 postgres 试图以
# gengyun_api_runtime 身份登录，都因无匹配行而被拒绝（见
# pg_hba.gengyun.conf 的 local 行 `peer map=gengyun_ops`）。
#
# 格式：map-name  system-username  database-username
# ============================================================================

gengyun_ops     postgres        gengyun_cvm_owner
